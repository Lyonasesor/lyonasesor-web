<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Google tag (gtag.js) -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comunicación Consciente | Lyon Asesor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0f0f0f;
      color: #ffffff;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .slide-container {
      max-width: 800px;
      width: 100%;
      background-color: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 3rem 2rem;
      min-height: 450px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }
    .slide-number {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      color: #cdaa7b;
      font-size: 0.8rem;
      letter-spacing: 0.1rem;
    }
    h1 { font-size: 2.2rem; font-weight: 600; color: #ffffff; margin-bottom: 1rem; }
    h2 { font-size: 1.4rem; font-weight: 400; color: #cdaa7b; margin-bottom: 1.5rem; }
    p { font-size: 1.1rem; line-height: 1.8; color: #ffffff; margin-bottom: 1rem; }
    ul { list-style: none; padding: 0; }
    ul li { padding: 0.5rem 0; padding-left: 1.5rem; position: relative; }
    ul li::before { content: "▸"; position: absolute; left: 0; color: #cdaa7b; }
    .highlight-box {
      background-color: #222;
      border-left: 3px solid #cdaa7b;
      padding: 1.2rem 1.5rem;
      margin: 1.5rem 0;
      border-radius: 0 8px 8px 0;
      font-style: italic;
    }
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin: 1.5rem 0;
    }
    .col-box {
      background-color: #222;
      padding: 1.2rem;
      border-radius: 8px;
    }
    .col-box h3 { color: #cdaa7b; margin-bottom: 0.5rem; font-size: 1rem; }
    .col-box p { font-size: 0.9rem; color: #e8e8e8; }
    .step-box {
      display: grid;
      gap: 0.8rem;
      margin: 1.5rem 0;
    }
    .step-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      background-color: #222;
      padding: 0.8rem 1.2rem;
      border-radius: 8px;
    }
    .step-num {
      background: #cdaa7b;
      color: #0f0f0f;
      font-weight: 700;
      font-size: 1.2rem;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .step-text { font-size: 0.9rem; }
    .nav { display: flex; justify-content: space-between; margin-top: 2rem; gap: 1rem; }
    .btn {
      background: transparent;
      border: 1px solid #cdaa7b;
      color: #cdaa7b;
      padding: 0.7rem 1.5rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn:hover { background: #cdaa7b; color: #0f0f0f; }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .progress { text-align: center; color: #999999; font-size: 0.8rem; margin-top: 1rem; }
    .interactive-box {
      background-color: #222;
      padding: 1.5rem;
      border-radius: 8px;
      margin: 1rem 0;
      text-align: center;
    }
    .options { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-top: 1rem; }
    .option-btn {
      background: transparent;
      border: 1px solid #666;
      color: #ffffff;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .option-btn:hover { border-color: #cdaa7b; color: #cdaa7b; }
    .option-btn.selected { background: #cdaa7b; color: #0f0f0f; border-color: #cdaa7b; }
  </style>
</head>
<body>
  <div class="slide-container" id="slideContainer">
    <span class="slide-number" id="slideNumber">1 / 10</span>
    <div id="slideContent"></div>
  </div>
  <div class="nav">
    <button class="btn" id="prevBtn" onclick="prevSlide()">← Anterior</button>
    <button class="btn" id="nextBtn" onclick="nextSlide()">Siguiente →</button>
  </div>
  <div class="progress" id="progress">Diapositiva 1 de 10 · Comunicación Consciente · 90 minutos</div>
  <script>
    let currentSlide = 0;
    const slides = [
      `
        <h1>Comunicación Consciente</h1>
        <h2>Del Conflicto a la Conexión</h2>
        <p>Prof. Mtr. Alvaro Lyon · Lyon Asesor, f.p.</p>
        <p style="color: #cccccc; margin-top: 2rem;">Conferencia corporativa · 90 minutos de duración</p>
        <p style="color: #999999;">Incluye: Marco teorico - Ejercicios practicos - Espacio de preguntas - Diploma + Ebook</p>
      `,
      `
        <h2>El Ruido que Nos Separa</h2>
        <p>Pasamos el 70% de nuestra vida laboral comunicándonos.</p>
        <p>Y aún así, los malentendidos son la principal causa de conflictos en los equipos.</p>
        <p>¿Cuántas reuniones terminan con todos asintiendo y nadie entendiendo?</p>
        <div class="highlight-box">El problema no es la cantidad de comunicación. Es la calidad de la presencia que ponemos en ella.</div>
      `,
      `
        <h2>Las Neuronas Espejo</h2>
        <p>Descubiertas por Giacomo Rizzolatti en 1996, las neuronas espejo se activan tanto cuando realizamos una acción como cuando observamos a alguien realizarla.</p>
        <p>Esto significa que:</p>
        <ul>
          <li>Tu estado emocional contagia a tu equipo</li>
          <li>Si llegas estresado, el cerebro de los demás lo registra</li>
          <li>Si escuchas con presencia, los demás se sienten escuchados</li>
        </ul>
        <div class="highlight-box">No podemos no comunicar. Incluso en silencio, nuestro cerebro está enviando señales que el cerebro de los demás está procesando.</div>
      `,
      `
        <h2>Los Dos Modos de Escucha</h2>
        <div class="two-col">
          <div class="col-box">
            <h3>🔴 Escucha Reactiva</h3>
            <p>Escucho para responder. Mientras hablas, estoy preparando mi argumento. Busco tener razón. Interrumpo mentalmente. El otro se siente invalidado.</p>
          </div>
          <div class="col-box">
            <h3>🟢 Escucha Consciente</h3>
            <p>Escucho para comprender. Mientras hablas, estoy presente. Busco entender tu perspectiva. No preparo mi respuesta. El otro se siente visto.</p>
          </div>
        </div>
      `,
      `
        <h2>El Método de los 4 Pasos</h2>
        <p>Marshall Rosenberg desarrolló la Comunicación No Violenta (CNV).</p>
        <p>Su eficacia está validada en mediación de conflictos internacionales, prisiones y empresas.</p>
        <div class="step-box">
          <div class="step-item"><span class="step-num">1</span><span class="step-text"><strong>Observar sin juzgar:</strong> Describir el hecho concreto, sin adjetivos ni interpretaciones.</span></div>
          <div class="step-item"><span class="step-num">2</span><span class="step-text"><strong>Identificar el sentimiento:</strong> Nombrar la emoción que ese hecho genera en mí.</span></div>
          <div class="step-item"><span class="step-num">3</span><span class="step-text"><strong>Reconocer la necesidad:</strong> Detectar qué necesidad insatisfecha hay detrás del sentimiento.</span></div>
          <div class="step-item"><span class="step-num">4</span><span class="step-text"><strong>Formular una petición:</strong> Pedir algo concreto y negociable, no exigir.</span></div>
        </div>
      `,
      `
        <h2>Momento de Práctica</h2>
        <p>Un colega te dice: "Siempre llegas tarde a las reuniones. Eres un irresponsable."</p>
        <p>¿Cuál sería una respuesta desde la Comunicación Consciente?</p>
        <div class="interactive-box">
          <div class="options" id="q3Options">
            <button class="option-btn" onclick="selectOption(this, 'q3')">"Tú tampoco eres perfecto."</button>
            <button class="option-btn" onclick="selectOption(this, 'q3')">"Cuando me dices eso, me siento frustrado. Necesito que me hables de hechos concretos."</button>
            <button class="option-btn" onclick="selectOption(this, 'q3')">"No es cierto, exageras."</button>
            <button class="option-btn" onclick="selectOption(this, 'q3')">Callar e irme.</button>
          </div>
        </div>
      `,
      `
        <h2>El Poder del Silencio</h2>
        <p>En la comunicación consciente, el silencio no es ausencia de palabras. Es presencia plena.</p>
        <p>Hacer una pausa de 3 segundos antes de responder permite que:</p>
        <ul>
          <li>Tu amígdala se calme y tu corteza prefrontal recupere el control</li>
          <li>Proceses realmente lo que el otro dijo</li>
          <li>Respondas desde la conciencia, no desde la reacción</li>
        </ul>
        <div class="highlight-box">Entre el estímulo y la respuesta hay un espacio. En ese espacio reside nuestra libertad. — Viktor Frankl</div>
      `,
      `
        <h2>Tres Herramientas para Hoy</h2>
        <ul>
          <li><strong>Validación antes que solución:</strong> Cuando alguien te comparte un problema, tu primera respuesta no debe ser una solución. Debe ser: "Entiendo por qué te sientes así." La validación reduce el cortisol.</li>
          <li><strong>Preguntas abiertas:</strong> Sustituye "¿estás bien?" por "¿cómo estás realmente?". Las preguntas cerradas generan respuestas automáticas. Las abiertas invitan a la conexión.</li>
          <li><strong>El eco empático:</strong> Repite con tus palabras lo que entendiste: "Si te entiendo bien, lo que me dices es que...". Esto activa las neuronas espejo de ambos.</li>
        </ul>
      `,
      `
        <h2>Del Conflicto a la Conexión</h2>
        <p>Un conflicto no es una batalla que se gana o se pierde.</p>
        <p>Es una señal de que dos necesidades legítimas no han encontrado todavía un lenguaje común.</p>
        <p>La comunicación consciente no evita los desacuerdos. Los transforma en puentes.</p>
      `,
      `
        <h2>El Legado de tu Palabra</h2>
        <p>Cada conversación que tienes deja una huella en el cerebro de quien te escucha.</p>
        <p>Puedes dejar cortisol o puedes dejar oxitocina.</p>
        <p>Puedes generar defensa o puedes generar apertura.</p>
        <p>La diferencia no está en lo que dices. Está en cómo estás presente mientras lo dices.</p>
        <div class="highlight-box">Comunicar es fácil. Conectar es un arte que se entrena.</div>
        <p style="text-align: center; margin-top: 2rem; color: #cdaa7b;">Prof. Mtr. Alvaro Lyon · Lyon Asesor, f.p.</p>
      `
    ];
    function renderSlide() {
      document.getElementById('slideContent').innerHTML = slides[currentSlide];
      document.getElementById('slideNumber').textContent = `${currentSlide + 1} / ${slides.length}`;
      document.getElementById('progress').textContent = `Diapositiva ${currentSlide + 1} de ${slides.length} · Comunicación Consciente · 90 minutos`;
      document.getElementById('prevBtn').disabled = (currentSlide === 0);
      document.getElementById('nextBtn').textContent = (currentSlide === slides.length - 1) ? 'Finalizar' : 'Siguiente →';
    }
    function nextSlide() { if (currentSlide < slides.length - 1) { currentSlide++; renderSlide(); } }
    function prevSlide() { if (currentSlide > 0) { currentSlide--; renderSlide(); } }
    function selectOption(btn, questionId) {
      const options = document.querySelectorAll(`#${questionId}Options .option-btn`);
      options.forEach(opt => opt.classList.remove('selected'));
      btn.classList.add('selected');
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextSlide(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    });
    renderSlide();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autoestima Corporativa | Lyon Asesor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0f0f0f;
      color: #e0e0e0;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .slide-container {
      max-width: 800px;
      width: 100%;
      background-color: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 3rem 2rem;
      min-height: 450px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }
    .slide-number {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      color: #cdaa7b;
      font-size: 0.8rem;
      letter-spacing: 0.1rem;
    }
    h1 { font-size: 2.2rem; font-weight: 600; color: #ffffff; margin-bottom: 1rem; }
    h2 { font-size: 1.4rem; font-weight: 400; color: #cdaa7b; margin-bottom: 1.5rem; }
    p { font-size: 1.1rem; line-height: 1.8; color: #c0c0c0; margin-bottom: 1rem; }
    ul { list-style: none; padding: 0; }
    ul li { padding: 0.5rem 0; padding-left: 1.5rem; position: relative; }
    ul li::before { content: "▸"; position: absolute; left: 0; color: #cdaa7b; }
    .highlight-box {
      background-color: #222;
      border-left: 3px solid #cdaa7b;
      padding: 1.2rem 1.5rem;
      margin: 1.5rem 0;
      border-radius: 0 8px 8px 0;
      font-style: italic;
    }
    .pillar-box {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin: 1.5rem 0;
    }
    .pillar-card {
      background-color: #222;
      padding: 1.2rem;
      border-radius: 8px;
      text-align: center;
    }
    .pillar-card .emoji { font-size: 2rem; margin-bottom: 0.5rem; }
    .pillar-card .name { font-weight: 600; color: #cdaa7b; margin-bottom: 0.3rem; }
    .pillar-card .desc { font-size: 0.8rem; color: #a0a0a0; }
    .nav { display: flex; justify-content: space-between; margin-top: 2rem; gap: 1rem; }
    .btn {
      background: transparent;
      border: 1px solid #cdaa7b;
      color: #cdaa7b;
      padding: 0.7rem 1.5rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn:hover { background: #cdaa7b; color: #0f0f0f; }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .progress { text-align: center; color: #555; font-size: 0.8rem; margin-top: 1rem; }
    .interactive-box {
      background-color: #222;
      padding: 1.5rem;
      border-radius: 8px;
      margin: 1rem 0;
      text-align: center;
    }
    .options { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-top: 1rem; }
    .option-btn {
      background: transparent;
      border: 1px solid #555;
      color: #e0e0e0;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .option-btn:hover { border-color: #cdaa7b; color: #cdaa7b; }
    .option-btn.selected { background: #cdaa7b; color: #0f0f0f; border-color: #cdaa7b; }
  </style>
</head>
<body>
  <div class="slide-container" id="slideContainer">
    <span class="slide-number" id="slideNumber">1 / 10</span>
    <div id="slideContent"></div>
  </div>
  <div class="nav">
    <button class="btn" id="prevBtn" onclick="prevSlide()">← Anterior</button>
    <button class="btn" id="nextBtn" onclick="nextSlide()">Siguiente →</button>
  </div>
  <div class="progress" id="progress">Diapositiva 1 de 10 · Autoestima Corporativa · 1 hora</div>
  <script>
    let currentSlide = 0;
    const slides = [
      `
        <h1>Autoestima Corporativa</h1>
        <h2>El Pilar del Éxito Sostenible</h2>
        <p>Prof. Mtr. Alvaro Lyon · Lyon Asesor, f.p.</p>
        <p style="color: #888; margin-top: 2rem;">Conferencia corporativa · 1 hora de duración</p>
        <p style="color: #555;">Diploma + Ebook incluidos</p>
      `,
      `
        <h2>El Elefante en la Sala de Juntas</h2>
        <p>Hablamos de KPIs, de productividad, de retorno de inversión.</p>
        <p>Pero hay un factor que determina el 80% de los resultados y que casi nunca se menciona en las reuniones de directorio.</p>
        <div class="highlight-box">La autoestima colectiva de una organización es directamente proporcional a su capacidad de innovar, retener talento y superar crisis.</div>
        <p>No es un tema "blando". Es el cimiento sobre el que se construye —o se derrumba— todo lo demás.</p>
      `,
      `
        <h2>¿Qué Es la Autoestima Corporativa?</h2>
        <p>Es la valoración compartida que los miembros de una organización tienen sobre su capacidad colectiva para generar valor, afrontar desafíos y merecer el éxito.</p>
        <p>Según la teoría de la identidad social, los empleados derivan parte de su autoconcepto de la organización a la que pertenecen.</p>
        <p>Tiene tres dimensiones:</p>
        <ul>
          <li>Valoración del talento interno: "Lo que hacemos aquí es valioso"</li>
          <li>Sentido de merecimiento: "Merecemos los buenos resultados"</li>
          <li>Confianza en la capacidad: "Podemos con los desafíos"</li>
        </ul>
      `,
      `
        <h2>Los Tres Pilares del Éxito Sostenible</h2>
        <div class="pillar-box">
          <div class="pillar-card">
            <div class="emoji">🔍</div>
            <div class="name">Autoconocimiento Organizacional</div>
            <div class="desc">Saber quiénes somos, qué sabemos hacer y qué no. Sin autoengaños.</div>
          </div>
          <div class="pillar-card">
            <div class="emoji">🛡️</div>
            <div class="name">Seguridad Psicológica</div>
            <div class="desc">Equipos donde equivocarse no se castiga y preguntar no se penaliza.</div>
          </div>
          <div class="pillar-card">
            <div class="emoji">🏆</div>
            <div class="name">Celebración del Logro</div>
            <div class="desc">Reconocer los avances, no solo los resultados finales.</div>
          </div>
        </div>
      `,
      `
        <h2>El Caso de Google (Proyecto Aristóteles)</h2>
        <p>Google invirtió millones investigando qué hace efectivo a un equipo. Analizaron 180 equipos durante dos años.</p>
        <p>El hallazgo principal no fue la inteligencia colectiva ni la experiencia de los miembros.</p>
        <p>Fue la <strong>seguridad psicológica</strong>: la creencia compartida de que el equipo es un lugar seguro para asumir riesgos interpersonales.</p>
        <div class="highlight-box">Los equipos con alta seguridad psicológica superaron sus metas de ventas en un 17%. Los de baja seguridad las incumplieron en un 19%.</div>
      `,
      `
        <h2>Momento de Diagnóstico</h2>
        <p>Evalúa honestamente a tu organización en estas tres dimensiones. Del 1 al 10:</p>
        <div class="interactive-box">
          <p style="margin-bottom: 1rem;">¿En qué nivel está la seguridad psicológica de tu equipo?</p>
          <div class="options" id="q2Options">
            <button class="option-btn" onclick="selectOption(this, 'q2')">1-3: Se castiga el error</button>
            <button class="option-btn" onclick="selectOption(this, 'q2')">4-6: Hay confianza parcial</button>
            <button class="option-btn" onclick="selectOption(this, 'q2')">7-8: Mayormente seguro</button>
            <button class="option-btn" onclick="selectOption(this, 'q2')">9-10: Total confianza</button>
          </div>
        </div>
      `,
      `
        <h2>La Autoestima Empieza en la Cima</h2>
        <p>Un líder que no confía en sí mismo no puede transmitir confianza a su equipo.</p>
        <p>Un líder que no se valora, desvaloriza a los demás —a veces sin darse cuenta.</p>
        <p>La autoestima corporativa se contagia. Desde arriba hacia abajo. O desde arriba, pero nunca desde abajo hacia arriba.</p>
        <p>Según estudios de la Universidad de Michigan, un líder con alta autoestima tiene un 40% más de probabilidades de generar equipos de alto rendimiento.</p>
      `,
      `
        <h2>Tres Hábitos para Construir Autoestima Corporativa</h2>
        <ul>
          <li><strong>Reconocimiento específico y público:</strong> No un "buen trabajo" genérico. Señala exactamente qué hizo bien la persona y por qué fue valioso. La oxitocina se libera tanto en quien recibe como en quien observa el reconocimiento.</li>
          <li><strong>Celebración de los fracasos inteligentes:</strong> Diferencia entre negligencia y experimentación. Cuando alguien intenta algo nuevo y no funciona, celébralo como inversión en aprendizaje.</li>
          <li><strong>Reuniones de fortalezas:</strong> Una vez al mes, dedica 20 minutos a que cada miembro comparta una fortaleza que vio en un compañero.</li>
        </ul>
      `,
      `
        <h2>El Caso de Pixar: El "Braintrust"</h2>
        <p>En Pixar existe un grupo llamado "Braintrust" que revisa cada película en producción.</p>
        <p>Sus reglas son simples pero profundas:</p>
        <ul>
          <li>La crítica es siempre a la obra, nunca al creador</li>
          <li>No hay autoridad jerárquica en la sala</li>
          <li>El director tiene la última palabra, pero debe escucharlo todo primero</li>
        </ul>
        <div class="highlight-box">"Los primeros cortes de nuestras películas son un desastre. Y sé que digo la palabra 'desastre' con cariño." — Ed Catmull, cofundador de Pixar</div>
      `,
      `
        <h2>Construir desde la Fortaleza</h2>
        <p>Una organización con autoestima saludable no se define por la ausencia de problemas.</p>
        <p>Se define por la convicción compartida de que, pase lo que pase, tenemos los recursos internos para enfrentarlo.</p>
        <p>Eso no se compra con un bonus.</p>
        <p>Se construye día a día, con líderes que ven el valor en su gente antes de que los resultados lo confirmen.</p>
        <div class="highlight-box">La autoestima corporativa no es el premio por llegar a la meta. Es el motor que te permite recorrer el camino.</div>
        <p style="text-align: center; margin-top: 2rem; color: #cdaa7b;">Prof. Mtr. Alvaro Lyon · Lyon Asesor, f.p.</p>
      `
    ];
    function renderSlide() {
      document.getElementById('slideContent').innerHTML = slides[currentSlide];
      document.getElementById('slideNumber').textContent = `${currentSlide + 1} / ${slides.length}`;
      document.getElementById('progress').textContent = `Diapositiva ${currentSlide + 1} de ${slides.length} · Autoestima Corporativa · 1 hora`;
      document.getElementById('prevBtn').disabled = (currentSlide === 0);
      document.getElementById('nextBtn').textContent = (currentSlide === slides.length - 1) ? 'Finalizar' : 'Siguiente →';
    }
    function nextSlide() { if (currentSlide < slides.length - 1) { currentSlide++; renderSlide(); } }
    function prevSlide() { if (currentSlide > 0) { currentSlide--; renderSlide(); } }
    function selectOption(btn, questionId) {
      const options = document.querySelectorAll(`#${questionId}Options .option-btn`);
      options.forEach(opt => opt.classList.remove('selected'));
      btn.classList.add('selected');
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextSlide(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    });
    renderSlide();
  </script>
</body>
</html>

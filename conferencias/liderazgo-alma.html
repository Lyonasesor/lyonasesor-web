<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liderazgo con Alma | Lyon Asesor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0f0f0f;
      color: #e0e0e0;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .slide-container {
      max-width: 800px;
      width: 100%;
      background-color: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 3rem 2rem;
      min-height: 450px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }
    .slide-number {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      color: #cdaa7b;
      font-size: 0.8rem;
      letter-spacing: 0.1rem;
    }
    h1 { font-size: 2.2rem; font-weight: 600; color: #ffffff; margin-bottom: 1rem; }
    h2 { font-size: 1.4rem; font-weight: 400; color: #cdaa7b; margin-bottom: 1.5rem; }
    p { font-size: 1.1rem; line-height: 1.8; color: #c0c0c0; margin-bottom: 1rem; }
    ul { list-style: none; padding: 0; }
    ul li { padding: 0.5rem 0; padding-left: 1.5rem; position: relative; }
    ul li::before { content: "▸"; position: absolute; left: 0; color: #cdaa7b; }
    .highlight-box {
      background-color: #222;
      border-left: 3px solid #cdaa7b;
      padding: 1.2rem 1.5rem;
      margin: 1.5rem 0;
      border-radius: 0 8px 8px 0;
      font-style: italic;
    }
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin: 1.5rem 0;
    }
    .col-box {
      background-color: #222;
      padding: 1.2rem;
      border-radius: 8px;
    }
    .col-box h3 { color: #cdaa7b; margin-bottom: 0.5rem; font-size: 1rem; }
    .col-box p { font-size: 0.9rem; color: #a0a0a0; }
    .pillar-box {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin: 1.5rem 0;
    }
    .pillar-card {
      background-color: #222;
      padding: 1.2rem;
      border-radius: 8px;
      text-align: center;
    }
    .pillar-card .emoji { font-size: 2rem; margin-bottom: 0.5rem; }
    .pillar-card .name { font-weight: 600; color: #cdaa7b; margin-bottom: 0.3rem; }
    .pillar-card .desc { font-size: 0.8rem; color: #a0a0a0; }
    .nav { display: flex; justify-content: space-between; margin-top: 2rem; gap: 1rem; }
    .btn {
      background: transparent;
      border: 1px solid #cdaa7b;
      color: #cdaa7b;
      padding: 0.7rem 1.5rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn:hover { background: #cdaa7b; color: #0f0f0f; }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .progress { text-align: center; color: #555; font-size: 0.8rem; margin-top: 1rem; }
    .interactive-box {
      background-color: #222;
      padding: 1.5rem;
      border-radius: 8px;
      margin: 1rem 0;
      text-align: center;
    }
    .options { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-top: 1rem; }
    .option-btn {
      background: transparent;
      border: 1px solid #555;
      color: #e0e0e0;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .option-btn:hover { border-color: #cdaa7b; color: #cdaa7b; }
    .option-btn.selected { background: #cdaa7b; color: #0f0f0f; border-color: #cdaa7b; }
  </style>
</head>
<body>
  <div class="slide-container" id="slideContainer">
    <span class="slide-number" id="slideNumber">1 / 10</span>
    <div id="slideContent"></div>
  </div>
  <div class="nav">
    <button class="btn" id="prevBtn" onclick="prevSlide()">← Anterior</button>
    <button class="btn" id="nextBtn" onclick="nextSlide()">Siguiente →</button>
  </div>
  <div class="progress" id="progress">Diapositiva 1 de 10 · Liderazgo con Alma · 1 hora</div>
  <script>
    let currentSlide = 0;
    const slides = [
      `
        <h1>Liderazgo con Alma</h1>
        <h2>Gestión de Equipos desde el Factor Humano</h2>
        <p>Prof. Mtr. Alvaro Lyon · Lyon Asesor, f.p.</p>
        <p style="color: #888; margin-top: 2rem;">Conferencia corporativa · 1 hora de duración</p>
        <p style="color: #555;">Diploma + Ebook incluidos</p>
      `,
      `
        <h2>Más Allá de los Números</h2>
        <p>La gestión tradicional mide resultados, productividad, eficiencia.</p>
        <p>Pero un equipo no es una máquina. Es un organismo vivo. Cada persona trae al trabajo su historia, sus miedos, sus talentos y sus heridas.</p>
        <p>El líder que solo ve indicadores está viendo la espuma de la ola. No el océano que la mueve.</p>
        <div class="highlight-box">Gestionar es organizar recursos. Liderar con alma es inspirar a seres humanos.</div>
      `,
      `
        <h2>Los Tres Cerebros del Equipo</h2>
        <p>El modelo del Cerebro Triuno de Paul MacLean se aplica también a la dinámica de un equipo.</p>
        <div class="pillar-box">
          <div class="pillar-card">
            <div class="emoji">🧠</div>
            <div class="name">Cerebro Reptil</div>
            <div class="desc">Supervivencia. Miedo al despido. Necesidad de estabilidad.</div>
          </div>
          <div class="pillar-card">
            <div class="emoji">❤️</div>
            <div class="name">Cerebro Límbico</div>
            <div class="desc">Emociones. Pertenencia. Reconocimiento. Vínculo.</div>
          </div>
          <div class="pillar-card">
            <div class="emoji">💡</div>
            <div class="name">Neocórtex</div>
            <div class="desc">Razón. Creatividad. Visión. Resolución de problemas.</div>
          </div>
        </div>
        <p>Un líder con alma atiende los tres. No solo el último.</p>
      `,
      `
        <h2>La Pirámide que se Derribó</h2>
        <p>Maslow pensó que primero necesitamos seguridad y luego pertenencia.</p>
        <p>La neurociencia actual muestra que el cerebro humano no funciona en escalera. Funciona en espiral.</p>
        <p>Un empleado con el sueldo asegurado puede renunciar porque no se siente visto. Otro con sueldo precario puede quedarse porque siente que su trabajo tiene sentido.</p>
        <div class="highlight-box">El factor humano no es un complemento de la gestión. Es la gestión misma.</div>
      `,
      `
        <h2>El Líder como Refugio Seguro</h2>
        <p>La teoría del apego de John Bowlby mostró que los niños necesitan una base segura para explorar el mundo.</p>
        <p>Los adultos también. En el trabajo, el líder es esa base segura.</p>
        <p>Cuando un empleado sabe que su líder le respalda, se atreve a innovar, a discrepar, a crecer.</p>
        <div class="highlight-box">Un equipo que teme a su líder sobrevive. Un equipo que confía en su líder se expande.</div>
      `,
      `
        <h2>Momento de Reflexión</h2>
        <p>Piensa en el mejor líder que has tenido. ¿Qué recuerdas de él o ella?</p>
        <div class="interactive-box">
          <p style="margin-bottom: 1rem;">Selecciona lo que más valoraste:</p>
          <div class="options" id="q4Options">
            <button class="option-btn" onclick="selectOption(this, 'q4')">Su conocimiento técnico</button>
            <button class="option-btn" onclick="selectOption(this, 'q4')">Su capacidad de escucharme</button>
            <button class="option-btn" onclick="selectOption(this, 'q4')">Su visión estratégica</button>
            <button class="option-btn" onclick="selectOption(this, 'q4')">Su coherencia entre lo que decía y hacía</button>
          </div>
        </div>
      `,
      `
        <h2>Las Cuatro Hambres del Equipo</h2>
        <p>Todo empleado tiene cuatro necesidades que van más allá del salario.</p>
        <ul>
          <li><strong>Ser visto:</strong> Que alguien note su esfuerzo. Que su nombre sea pronunciado con respeto.</li>
          <li><strong>Ser escuchado:</strong> Que sus ideas tengan espacio. Que su voz cuente.</li>
          <li><strong>Ser valorado:</strong> Que se reconozca su talento específico. No con un bono genérico, sino con una palabra precisa.</li>
          <li><strong>Pertenecer:</strong> Sentir que forma parte de algo más grande que sus tareas diarias.</li>
        </ul>
      `,
      `
        <h2>La Coherencia como Superpoder</h2>
        <p>El factor que más predice la confianza de un equipo en su líder no es su inteligencia ni su experiencia.</p>
        <p>Es la coherencia entre lo que dice y lo que hace.</p>
        <p>Cada vez que un líder predica excelencia y castiga el error honesto, destruye confianza.</p>
        <p>Cada vez que predica trabajo en equipo y se atribuye el mérito individual, destruye confianza.</p>
        <div class="highlight-box">La confianza se construye en micro-momentos de coherencia. Y se destruye en uno solo de hipocresía.</div>
      `,
      `
        <h2>Tres Acciones para Mañana</h2>
        <ul>
          <li><strong>Una conversación sin agenda:</strong> Dedica 10 minutos a hablar con alguien de tu equipo sin objetivo laboral. Pregúntale cómo está. De verdad.</li>
          <li><strong>Reconocimiento específico:</strong> Hoy, antes de irte, dile a una persona de tu equipo exactamente qué hizo bien y por qué fue importante. Sin un "pero" después.</li>
          <li><strong>Vulnerabilidad estratégica:</strong> Comparte un error que cometiste y lo que aprendiste. Un líder que se muestra humano da permiso a los demás para serlo.</li>
        </ul>
      `,
      `
        <h2>El Legado del Líder con Alma</h2>
        <p>Al final de tu carrera, nadie recordará cuántos informes entregaste a tiempo.</p>
        <p>Recordarán cómo los hiciste sentir.</p>
        <p>Si se sintieron vistos, escuchados, valorados.</p>
        <p>Si crecieron trabajando contigo o si se encogieron.</p>
        <div class="highlight-box">Liderar con alma no es una técnica. Es una decisión diaria de tratar a cada persona como el ser humano único e irrepetible que es.</div>
        <p style="text-align: center; margin-top: 2rem; color: #cdaa7b;">Prof. Mtr. Alvaro Lyon · Lyon Asesor, f.p.</p>
      `
    ];
    function renderSlide() {
      document.getElementById('slideContent').innerHTML = slides[currentSlide];
      document.getElementById('slideNumber').textContent = `${currentSlide + 1} / ${slides.length}`;
      document.getElementById('progress').textContent = `Diapositiva ${currentSlide + 1} de ${slides.length} · Liderazgo con Alma · 1 hora`;
      document.getElementById('prevBtn').disabled = (currentSlide === 0);
      document.getElementById('nextBtn').textContent = (currentSlide === slides.length - 1) ? 'Finalizar' : 'Siguiente →';
    }
    function nextSlide() { if (currentSlide < slides.length - 1) { currentSlide++; renderSlide(); } }
    function prevSlide() { if (currentSlide > 0) { currentSlide--; renderSlide(); } }
    function selectOption(btn, questionId) {
      const options = document.querySelectorAll(`#${questionId}Options .option-btn`);
      options.forEach(opt => opt.classList.remove('selected'));
      btn.classList.add('selected');
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextSlide(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    });
    renderSlide();
  </script>
</body>
</html>

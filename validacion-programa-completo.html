<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validación de Diploma - Programa Completo | Lyon Asesor</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f0eb;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            padding: 40px 44px;
            text-align: center;
        }
        @media (max-width: 600px) { .container { padding: 24px 20px; } }
        .brand img { max-height: 60px; width: auto; margin-bottom: 8px; }
        .brand .tagline {
            font-family: 'Playfair Display', serif;
            font-size: 0.75rem;
            color: #cdaa7b;
            letter-spacing: 0.2rem;
            text-transform: uppercase;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: #1a2330;
            margin: 12px 0 4px;
        }
        h1 span { color: #e86b18; }
        .subtitle { color: #5a6c7d; font-size: 0.95rem; margin-bottom: 24px; }

        .validation-card {
            background: #faf8f5;
            border-radius: 16px;
            padding: 24px;
            border: 1px solid #e8ddd0;
            text-align: left;
        }
        .validation-card .field {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f1f0ed;
            font-size: 0.9rem;
        }
        .validation-card .field:last-child { border-bottom: none; }
        .validation-card .label { color: #5a6c7d; font-weight: 500; }
        .validation-card .value { color: #1a2330; font-weight: 600; }

        .valid-badge {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            margin: 16px 0 8px;
        }
        .invalid-badge {
            display: inline-block;
            background: #fee2e2;
            color: #991b1b;
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            margin: 16px 0 8px;
        }
        .pending-badge {
            display: inline-block;
            background: #fef3c7;
            color: #92400e;
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            margin: 16px 0 8px;
        }

        .mensaje-autenticidad {
            background: #f5f0eb;
            border-radius: 12px;
            padding: 16px 20px;
            margin-top: 16px;
            font-size: 0.9rem;
            line-height: 1.7;
            color: #1a2330;
            border-left: 4px solid #cdaa7b;
        }

        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 20px;
            border-top: 1px solid #f1f0ed;
            padding-top: 16px;
        }
        .legal-framework {
            text-align: left;
            margin-top: 24px;
            border-top: 1px solid #f1f0ed;
            padding-top: 20px;
        }
        .legal-framework h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            color: #1a2330;
            margin-bottom: 14px;
        }
        .legal-section {
            background: #faf8f5;
            border-radius: 12px;
            padding: 16px 18px;
            margin-bottom: 12px;
            border: 1px solid #e8ddd0;
        }
        .legal-section h4 { font-size: 0.92rem; color: #1a2330; margin-bottom: 8px; }
        .legal-section p { font-size: 0.82rem; color: #5a6c7d; line-height: 1.6; margin-bottom: 8px; }
        .legal-section ul { font-size: 0.82rem; color: #5a6c7d; line-height: 1.7; padding-left: 18px; margin-bottom: 8px; }
        .legal-section li { margin-bottom: 4px; }
        .legal-section p em { color: #8899A6; }
        .verification-status {
            background: #fefdfb;
            border: 1px dashed #e86b18;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 0.82rem;
            color: #1a2330;
            line-height: 1.7;
        }
        .verification-status .code { font-family: 'Courier New', monospace; font-weight: 700; color: #e86b18; }
        .loading { padding: 30px 0; color: #5a6c7d; }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #f1f0ed;
            border-top-color: #cdaa7b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div class="brand">
        <img src="assets/img/LYON%20ASESOR.png" alt="Lyon Asesor">
        <div class="tagline">Programa Integral · 300 Horas Académicas</div>
    </div>

    <h1>Validación de Diploma<br><span>Programa Completo</span></h1>
    <p class="subtitle">Programa Lyon de NeuroLiderazgo y Transformación Humana</p>

    <div id="validationResult">
        <div class="loading">
            <div class="spinner"></div>
            <p>Verificando diploma...</p>
        </div>
    </div>

    <div class="footer-note">
        Lyon Asesor 2026 · Prof. Mtr. Álvaro Lyon
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const params = new URLSearchParams(window.location.search);
    const codigo = params.get('codigo');

    if (!codigo) {
        document.getElementById('validationResult').innerHTML = `
            <div class="invalid-badge">⛔ Acceso restringido</div>
            <p style="color:#5a6c7d; margin-top:12px;">Este enlace solo está disponible a través del código QR de tu diploma.</p>
        `;
        return;
    }

    validarDiploma(codigo);
});

async function validarDiploma(codigo) {
    const container = document.getElementById('validationResult');

    try {
        // Lectura directa por código: NO se recorre la colección protegida de
        // leads. "diplomas_publicos" es un nodo aparte que solo contiene los
        // campos necesarios para validar (sin correo ni WhatsApp), escrito por
        // registro.html en el momento del registro y de la descarga del PDF.
        const snapshot = await database.ref(`diplomas_programa_publicos/${codigo}`).once('value');
        const registro = snapshot.val();

        if (!registro) {
            container.innerHTML = `
                <div class="invalid-badge">⛔ Código no válido</div>
                <p style="color:#5a6c7d; margin-top:12px;">No se encontró ningún diploma con este código.</p>
                <p style="color:#94a3b8; font-size:0.85rem; margin-top:8px;">Verifica que el código sea correcto o contacta a soporte.</p>
            `;
            return;
        }

        if (!registro.descargado) {
            container.innerHTML = `
                <div class="pending-badge">⏳ Diploma pendiente</div>
                <p style="color:#5a6c7d; margin-top:12px;">Este diploma aún no ha sido formalmente emitido.</p>
                <p style="color:#94a3b8; font-size:0.85rem; margin-top:8px;">Contacta al administrador si tienes dudas.</p>
            `;
            return;
        }

        container.innerHTML = `
            <div class="valid-badge">✅ Diploma válido</div>
            <p style="color:#5a6c7d; font-size:0.9rem; margin-bottom:16px;">Este certificado fue emitido oficialmente por Lyon Asesor.</p>

            <div class="validation-card">
                <div class="field"><span class="label">Participante</span><span class="value">${registro.nombre}</span></div>
                <div class="field"><span class="label">Cédula / ID</span><span class="value">${registro.cedula}</span></div>
                <div class="field"><span class="label">Programa</span><span class="value">Programa Integral en NeuroLiderazgo y Transformación Humana</span></div>
                <div class="field"><span class="label">Duración</span><span class="value">300 horas académicas</span></div>
                <div class="field"><span class="label">Plan cursado</span><span class="value">${registro.plan === 'acelerado' ? 'Acelerado (6 meses)' : 'Extendido (12 meses)'}</span></div>
                <div class="field"><span class="label">Fecha de emisión</span><span class="value">${registro.fechaLegible || registro.fecha}</span></div>
                <div class="field"><span class="label">Código único</span><span class="value">${registro.codigoUnico}</span></div>
            </div>

            <div class="mensaje-autenticidad">
                <strong>📜 Mensaje de autenticidad</strong><br>
                Este diploma certifica que <strong>${registro.nombre}</strong> culminó y aprobó satisfactoriamente las 12 clases del "<strong>Programa Integral en NeuroLiderazgo y Transformación Humana</strong>", con una duración de 300 horas académicas, bajo los estándares de Lyon Asesor. La verificación de este documento garantiza su validez oficial.
            </div>

            <div style="margin-top:16px; font-size:0.85rem; color:#5a6c7d;">
                <p style="font-size:0.75rem; color:#94a3b8;">${registro.pais || ''}${registro.pais && registro.ciudad ? ', ' : ''}${registro.ciudad || ''}</p>
            </div>

            <div class="legal-framework">
                <h3>Marco Legal y Validez del Diploma</h3>

                <div class="legal-section">
                    <h4>✅ Validez en Venezuela</h4>
                    <p>Este diploma acredita la formación recibida en el <strong>Programa Lyon de NeuroLiderazgo y Transformación Humana</strong>, con una carga horaria de <strong>300 horas académicas</strong>, en el marco de la educación no formal reconocida por:</p>
                    <ul>
                        <li><strong>Constitución de la República Bolivariana de Venezuela</strong> (Artículos 102, 103 y 106) — derecho a la educación permanente y creación de instituciones educativas privadas.</li>
                        <li><strong>Ley Orgánica de Educación</strong> (Artículos 25 y 46) — acreditación de aprendizajes adquiridos fuera del sistema formal.</li>
                        <li><strong>Lineamientos para la Acreditación de Aprendizajes por Experiencia</strong> (Gaceta Oficial N.° 42.903 del 18/06/2024).</li>
                    </ul>
                    <p><em>Los certificados de educación no formal no reemplazan un título del sistema educativo formal, pero constituyen una prueba verificable de formación práctica y competencias adquiridas.</em></p>
                </div>

                <div class="legal-section">
                    <h4>🌍 Validez Internacional</h4>
                    <p>Este diploma se enmarca en los estándares internacionales de reconocimiento de cualificaciones de educación no formal, respaldado por:</p>
                    <ul>
                        <li><strong>Convención Global de la UNESCO sobre Reconocimiento de Cualificaciones (2019)</strong> — obliga a los países firmantes a reconocer o evaluar cualificaciones de educación no formal.</li>
                        <li><strong>Directrices UNESCO para el Reconocimiento, Validación y Acreditación del Aprendizaje No Formal e Informal (2012)</strong>.</li>
                        <li><strong>Recomendación de la Unión Europea sobre validación de aprendizaje no formal (2012)</strong> — aplicable en los 27 países de la UE.</li>
                    </ul>
                    <p><em>Para el reconocimiento oficial en otros países, se recomienda contactar con el centro ENIC/NARIC correspondiente para evaluar la "comparabilidad" del diploma.</em></p>
                </div>

                <div class="legal-section">
                    <h4>📜 Datos de la Institución</h4>
                    <ul>
                        <li><strong>Certificado de autoría de marca (eNotar.io / blockchain Emercoin):</strong> FUID 7922ea7748dac8fe2316100d0c1ddfc0f1e50a6ad05507d53047f6cefb7d9202</li>
                        <li><strong>Registro Mercantil:</strong> RM N.° 303, Tomo 3-B REGMERPRIBO, N.° 56, Año 2021 — Expediente 303-61809 (SAREN, Registro Mercantil Primero del Estado Bolívar)</li>
                        <li><strong>RIF:</strong> V-17633035-6</li>
                    </ul>
                    <p><a href="legal.html" style="color:#e86b18; font-weight:600; text-decoration:none;">Ver el detalle completo en la página Legal →</a></p>
                </div>

                <div class="verification-status">
                    <p><strong>Este diploma es verificable en línea mediante el código QR o el código de validación:</strong> <span class="code">${registro.codigoUnico}</span></p>
                    <p>Fecha de emisión: ${registro.fechaLegible || registro.fecha} · Horas académicas: 300 horas</p>
                </div>
            </div>
        `;

    } catch (error) {
        console.error('Error validando diploma:', error);
        container.innerHTML = `
            <div class="invalid-badge">⚠️ Error de verificación</div>
            <p style="color:#5a6c7d; margin-top:12px;">Hubo un problema al validar el diploma. Intenta de nuevo más tarde.</p>
        `;
    }
}
</script>
</body>
</html>

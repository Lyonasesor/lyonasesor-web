<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Integración y Cierre | Lyon Asesor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0d1117;
      background-image: radial-gradient(ellipse at 50% 50%, #1a1d24 0%, #0d1117 70%);
      color: #ffffff;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .slide-container {
      max-width: 800px;
      width: 100%;
      background-color: #161b22;
      border: 1px solid #8b9dc3;
      border-radius: 16px;
      padding: 3rem 2rem;
      min-height: 450px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      box-shadow: 0 0 25px rgba(139, 157, 195, 0.1);
    }
    .slide-number {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      color: #8b9dc3;
      font-size: 0.8rem;
      letter-spacing: 0.1rem;
      background: #1c2128;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
    }
    h1 { font-size: 2.2rem; font-weight: 600; color: #ffffff; margin-bottom: 1rem; }
    h2 { font-size: 1.4rem; font-weight: 400; color: #8b9dc3; margin-bottom: 1.5rem; }
    p { font-size: 1.1rem; line-height: 1.8; color: #ffffff; margin-bottom: 1rem; }
    ul { list-style: none; padding: 0; }
    ul li { padding: 0.5rem 0; padding-left: 1.5rem; position: relative; }
    ul li::before { content: "▸"; position: absolute; left: 0; color: #8b9dc3; }
    .highlight-box {
      background-color: #1c2128;
      border-left: 3px solid #8b9dc3;
      padding: 1.2rem 1.5rem;
      margin: 1.5rem 0;
      border-radius: 0 8px 8px 0;
      font-style: italic;
    }
    .grid-box {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin: 1.5rem 0;
    }
    .grid-card {
      background-color: #1c2128;
      padding: 1.2rem;
      border-radius: 8px;
      text-align: center;
    }
    .grid-card .emoji { font-size: 2rem; margin-bottom: 0.5rem; }
    .grid-card .name { font-weight: 600; color: #8b9dc3; margin-bottom: 0.3rem; }
    .grid-card .desc { font-size: 0.8rem; color: #e8e8e8; }
    .nav { display: flex; justify-content: space-between; margin-top: 2rem; gap: 1rem; }
    .btn {
      background: transparent;
      border: 1px solid #8b9dc3;
      color: #8b9dc3;
      padding: 0.7rem 1.5rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn:hover { background: #8b9dc3; color: #0d1117; }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .progress { text-align: center; color: #999999; font-size: 0.8rem; margin-top: 1rem; }
    .interactive-box {
      background-color: #1c2128;
      padding: 1.5rem;
      border-radius: 8px;
      margin: 1rem 0;
      text-align: center;
    }
    .options { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-top: 1rem; }
    .option-btn {
      background: transparent;
      border: 1px solid #666;
      color: #ffffff;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .option-btn:hover { border-color: #8b9dc3; color: #8b9dc3; }
    .option-btn.selected { background: #8b9dc3; color: #0d1117; border-color: #8b9dc3; }
  </style>
</head>
<body>
  <div class="slide-container" id="slideContainer">
    <span class="slide-number" id="slideNumber">1 / 10</span>
    <div id="slideContent"></div>
  </div>
  <div class="nav">
    <button class="btn" id="prevBtn" onclick="prevSlide()">← Anterior</button>
    <button class="btn" id="nextBtn" onclick="nextSlide()">Siguiente →</button>
  </div>
  <div class="progress" id="progress">Diapositiva 1 de 10 · Integración y Cierre · 90 minutos</div>
  <script>
    let currentSlide = 0;
    const slides = [
      `
        <h1>Integración y Cierre</h1>
        <h2>Consolidando el Nuevo Paradigma</h2>
        <p>Prof. Mtr. Alvaro Lyon · Lyon Asesor, f.p.</p>
        <p style="color: #cccccc; margin-top: 2rem;">Conferencia corporativa · 90 minutos de duración</p>
        <p style="color: #999999;">Incluye: Marco teorico - Ejercicios practicos - Espacio de preguntas - Diploma + Ebook</p>
      `,
      `
        <h2>El Viaje que Hemos Recorrido</h2>
        <p>Doce conferencias. Doce miradas al ser humano desde la neurociencia, la psicología y el liderazgo.</p>
        <p>Hemos hablado de cerebros que inspiran, de autoestima que sostiene, de comunicación que conecta. Hemos visto cómo el estrés puede gestionarse y cómo el cambio personal es biológicamente posible.</p>
        <p>Pero el conocimiento sin integración es como un rompecabezas sin armar. Las piezas están todas, pero no forman una imagen.</p>
        <div class="highlight-box">Hoy no vamos a aprender conceptos nuevos. Vamos a darles un lugar a los que ya tenemos. Vamos a consolidar un nuevo paradigma.</div>
      `,
      `
        <h2>¿Qué es un Paradigma?</h2>
        <p>Un paradigma es un conjunto de creencias, valores y supuestos que determinan cómo vemos la realidad y cómo actuamos en ella.</p>
        <p>Thomas Kuhn, en "La estructura de las revoluciones científicas", mostró que los paradigmas no cambian por acumulación de datos, sino por una reestructuración profunda de nuestra forma de pensar.</p>
        <p>Durante estas conferencias, hemos ido sembrando las semillas de un nuevo paradigma. Hoy toca reconocerlo, nombrarlo y comprometernos con él.</p>
        <div class="highlight-box">No vemos el mundo como es. Vemos el mundo como somos. — Talmud</div>
      `,
      `
        <h2>Los Cuatro Pilares del Nuevo Paradigma</h2>
        <div class="grid-box">
          <div class="grid-card">
            <div class="emoji">🧠</div>
            <div class="name">El Cerebro es Plástico</div>
            <div class="desc">No estás condenado a ser como siempre fuiste. Puedes cambiar. La neuroplasticidad es la base de la transformación.</div>
          </div>
          <div class="grid-card">
            <div class="emoji">❤️</div>
            <div class="name">La Emoción es Información</div>
            <div class="desc">No hay emociones buenas o malas. Todas traen datos valiosos. Gestionarlas no es suprimirlas; es escucharlas y canalizarlas.</div>
          </div>
          <div class="grid-card">
            <div class="emoji">🤝</div>
            <div class="name">La Conexión es Biológica</div>
            <div class="desc">Necesitamos a otros para regularnos, para crecer, para sanar. El individualismo radical es neurobiológicamente insostenible.</div>
          </div>
          <div class="grid-card">
            <div class="emoji">🌱</div>
            <div class="name">El Propósito es Salud</div>
            <div class="desc">Tener un porqué no es un lujo filosófico. Es un predictor de longevidad, bienestar y rendimiento sostenible.</div>
          </div>
        </div>
      `,
      `
        <h2>Del Conocimiento a la Sabiduría</h2>
        <p>Información es saber que el estrés daña el cerebro. Conocimiento es entender por qué y cómo. Sabiduría es aplicar ese conocimiento cada día.</p>
        <p>El paradigma que proponemos no se aprende en un manual. Se encarna. Se practica. Se falla y se vuelve a intentar.</p>
        <p>La brecha más grande no está entre lo que sabes y lo que ignoras. Está entre lo que sabes y lo que haces con lo que sabes.</p>
        <div class="highlight-box">La práctica no hace la perfección. La práctica hace la consolidación. Cada repetición fortalece un circuito. Cada acción alineada es un voto por la persona que quieres ser.</div>
      `,
      `
        <h2>Momento de Compromiso</h2>
        <p>De todo lo que has escuchado en estas sesiones, ¿qué idea, herramienta o perspectiva ha resonado más contigo?</p>
        <div class="interactive-box">
          <p style="margin-bottom: 1rem;">Elige tu palanca de cambio personal:</p>
          <div class="options" id="q12Options">
            <button class="option-btn" onclick="selectOption(this, 'q12')">Gestionar mejor mis emociones</button>
            <button class="option-btn" onclick="selectOption(this, 'q12')">Fortalecer mi autoestima</button>
            <button class="option-btn" onclick="selectOption(this, 'q12')">Mejorar mis relaciones</button>
            <button class="option-btn" onclick="selectOption(this, 'q12')">Vivir con más propósito</button>
          </div>
        </div>
      `,
      `
        <h2>La Integración es Personal</h2>
        <p>No hay un único camino. Cada persona integra lo aprendido de manera diferente. Lo importante es que el conocimiento no se quede en diapositivas.</p>
        <p>Pregúntate esta noche, en silencio: si pudiera llevarme solo una enseñanza de todo este recorrido, ¿cuál sería? Y más importante aún: ¿qué haré mañana distinto gracias a ella?</p>
        <p>La integración no es un acto intelectual. Es una decisión. Un punto de inflexión donde dices: "Esto ya no es algo que sé. Es algo que soy."</p>
        <div class="highlight-box">No eres tus hábitos pasados. Eres las decisiones que tomas hoy, y las que tomarás mañana, y las que tomarás cada día hasta construir la vida que mereces.</div>
      `,
      `
        <h2>Un Nuevo Comienzo</h2>
        <p>Un paradigma no se consolida en una conferencia. Se consolida en la conversación con un colega, en la pausa antes de reaccionar, en el abrazo dado a tiempo, en el límite puesto con respeto.</p>
        <p>Se consolida cuando un líder elige escuchar en lugar de imponer. Cuando un equipo decide aprender del error en lugar de culpar. Cuando una persona se mira al espejo y, en lugar de criticarse, se reconoce.</p>
        <p>El nuevo paradigma no está en estas diapositivas. Está en ti. En lo que harás con lo que aquí recibiste.</p>
      `,
      `
        <h2>Gracias por el Viaje</h2>
        <p>Esto no es un adiós. Es un hasta luego. El conocimiento que has adquirido no se desvanece; se transforma en acción, en relaciones más sanas, en equipos más humanos.</p>
        <p>Te llevas herramientas. Te llevas ciencia. Pero sobre todo, te llevas la certeza de que el cambio es posible, porque tu cerebro está diseñado para ello.</p>
        <p>Gracias por tu atención, tu presencia y tu compromiso con tu propio crecimiento.</p>
      `,
      `
        <h2>El Legado es Ahora</h2>
        <p>No esperes a mañana para liderar con el cerebro en mente. No esperes a la próxima crisis para practicar la resiliencia. No esperes a sentirte seguro para empezar a construir.</p>
        <p>El momento de consolidar un nuevo paradigma es este. El legado no se deja al final del camino. Se construye en cada paso.</p>
        <p>Ha sido un honor acompañarte. Sigamos en contacto.</p>
        <div class="highlight-box">Prof. Mtr. Alvaro Lyon · Lyon Asesor, f.p.</div>
        <p style="text-align: center; margin-top: 2rem; color: #8b9dc3;">lyonasesor@gmail.com</p>
      `
    ];
    function renderSlide() {
      document.getElementById('slideContent').innerHTML = slides[currentSlide];
      document.getElementById('slideNumber').textContent = `${currentSlide + 1} / ${slides.length}`;
      document.getElementById('progress').textContent = `Diapositiva ${currentSlide + 1} de ${slides.length} · Integración y Cierre · 90 minutos`;
      document.getElementById('prevBtn').disabled = (currentSlide === 0);
      document.getElementById('nextBtn').textContent = (currentSlide === slides.length - 1) ? 'Finalizar' : 'Siguiente →';
    }
    function nextSlide() { if (currentSlide < slides.length - 1) { currentSlide++; renderSlide(); } }
    function prevSlide() { if (currentSlide > 0) { currentSlide--; renderSlide(); } }
    function selectOption(btn, questionId) {
      const options = document.querySelectorAll(`#${questionId}Options .option-btn`);
      options.forEach(opt => opt.classList.remove('selected'));
      btn.classList.add('selected');
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextSlide(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    });
    renderSlide();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neuroeducación | Lyon Asesor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      /* Fondo con un sutil degradado para diferenciarla */
      background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
      color: #e0e0e0;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .slide-container {
      max-width: 800px;
      width: 100%;
      /* Fondo con un tono ligeramente más cálido y doble borde */
      background-color: #1c1c1c;
      border: 1px solid #cdaa7b;
      box-shadow: 0 0 15px rgba(205, 170, 123, 0.1);
      border-radius: 16px;
      padding: 3rem 2rem;
      min-height: 450px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }
    .slide-number {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      color: #cdaa7b;
      font-size: 0.8rem;
      letter-spacing: 0.1rem;
      background: #222;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
    }
    h1 { font-size: 2.2rem; font-weight: 600; color: #ffffff; margin-bottom: 1rem; }
    h2 { font-size: 1.4rem; font-weight: 400; color: #d4b896; margin-bottom: 1.5rem; } /* Dorado ligeramente más claro */
    p { font-size: 1.1rem; line-height: 1.8; color: #c0c0c0; margin-bottom: 1rem; }
    ul { list-style: none; padding: 0; }
    ul li { padding: 0.5rem 0; padding-left: 1.5rem; position: relative; }
    ul li::before { content: "▸"; position: absolute; left: 0; color: #d4b896; }
    .highlight-box {
      background-color: #222;
      border-left: 3px solid #d4b896;
      padding: 1.2rem 1.5rem;
      margin: 1.5rem 0;
      border-radius: 0 8px 8px 0;
      font-style: italic;
    }
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin: 1.5rem 0;
    }
    .col-box {
      background-color: #222;
      padding: 1.2rem;
      border-radius: 8px;
    }
    .col-box h3 { color: #d4b896; margin-bottom: 0.5rem; font-size: 1rem; }
    .col-box p { font-size: 0.9rem; color: #a0a0a0; }
    .step-box {
      display: grid;
      gap: 0.8rem;
      margin: 1.5rem 0;
    }
    .step-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      background-color: #222;
      padding: 0.8rem 1.2rem;
      border-radius: 8px;
    }
    .step-num {
      background: #d4b896;
      color: #0f0f0f;
      font-weight: 700;
      font-size: 1.2rem;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .step-text { font-size: 0.9rem; }
    .nav { display: flex; justify-content: space-between; margin-top: 2rem; gap: 1rem; }
    .btn {
      background: transparent;
      border: 1px solid #d4b896;
      color: #d4b896;
      padding: 0.7rem 1.5rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn:hover { background: #d4b896; color: #0f0f0f; }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .progress { text-align: center; color: #555; font-size: 0.8rem; margin-top: 1rem; }
    .interactive-box {
      background-color: #222;
      padding: 1.5rem;
      border-radius: 8px;
      margin: 1rem 0;
      text-align: center;
    }
    .options { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-top: 1rem; }
    .option-btn {
      background: transparent;
      border: 1px solid #555;
      color: #e0e0e0;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .option-btn:hover { border-color: #d4b896; color: #d4b896; }
    .option-btn.selected { background: #d4b896; color: #0f0f0f; border-color: #d4b896; }
  </style>
</head>
<body>
  <div class="slide-container" id="slideContainer">
    <span class="slide-number" id="slideNumber">1 / 10</span>
    <div id="slideContent"></div>
  </div>
  <div class="nav">
    <button class="btn" id="prevBtn" onclick="prevSlide()">← Anterior</button>
    <button class="btn" id="nextBtn" onclick="nextSlide()">Siguiente →</button>
  </div>
  <div class="progress" id="progress">Diapositiva 1 de 10 · Neuroeducación · 1 hora</div>
  <script>
    let currentSlide = 0;
    const slides = [
      `
        <h1>Neuroeducación</h1>
        <h2>Cómo el Cerebro Aprende y Transforma</h2>
        <p>Prof. Mtr. Alvaro Lyon · Lyon Asesor, f.p.</p>
        <p style="color: #888; margin-top: 2rem;">Conferencia corporativa · 1 hora de duración</p>
        <p style="color: #555;">Diploma + Ebook incluidos</p>
      `,
      `
        <h2>La Revolución Silenciosa</h2>
        <p>La neuroeducación es la convergencia entre la neurociencia, la psicología y la pedagogía.</p>
        <p>No es una moda. Es la comprensión, por primera vez en la historia, de lo que ocurre físicamente en el cerebro cuando alguien aprende.</p>
        <p>El Dr. Paul Howard-Jones, de la Universidad de Bristol, demostró que los docentes que entienden cómo funciona el cerebro de sus estudiantes obtienen mejores resultados académicos, independientemente de los recursos disponibles.</p>
        <div class="highlight-box">Enseñar sin saber cómo aprende el cerebro es como intentar reparar un motor sin conocer sus piezas.</div>
      `,
      `
        <h2>Los Tres Cerebros en el Aula</h2>
        <p>El modelo del Cerebro Triuno de Paul MacLean tiene una aplicación directa en la educación.</p>
        <div class="two-col">
          <div class="col-box">
            <h3>🧠 Reptil (Supervivencia)</h3>
            <p>Si un estudiante tiene miedo, hambre o se siente amenazado, su cerebro reptil bloquea el acceso al aprendizaje. No es rebeldía. Es biología.</p>
          </div>
          <div class="col-box">
            <h3>❤️ Límbico (Emoción)</h3>
            <p>La emoción es el pegamento de la memoria. Un contenido que no despierta ninguna emoción positiva se olvida rápidamente. La curiosidad y la sorpresa son las puertas de entrada al aprendizaje.</p>
          </div>
        </div>
        <p style="margin-top:1rem;">El <strong>neocórtex</strong> (razón) solo puede operar cuando el reptil está tranquilo y el límbico está motivado.</p>
      `,
      `
        <h2>La Atención: El Filtro del Aprendizaje</h2>
        <p>El cerebro recibe 11 millones de bits de información por segundo, pero solo procesa conscientemente unos 40 bits. La atención es el filtro que decide qué entra y qué no.</p>
        <p>La atención no es un interruptor que se enciende o se apaga. Es un músculo que se fatiga. Después de 10-15 minutos de exposición pasiva, la atención decae drásticamente.</p>
        <div class="highlight-box">Un docente que habla 45 minutos seguidos está hablando solo. El cerebro de sus estudiantes se desconectó mucho antes.</div>
      `,
      `
        <h2>La Curva de la Atención</h2>
        <p>El Dr. John Medina, en su libro "Brain Rules", establece que el cerebro presta atención en ciclos de aproximadamente 10 minutos.</p>
        <p>Estrategias para resetear la atención:</p>
        <ul>
          <li>Cambiar el estímulo cada 10-12 minutos (una pregunta, una imagen, un cambio de tono)</li>
          <li>Vincular el contenido nuevo con una emoción (sorpresa, humor, relevancia personal)</li>
          <li>Dar pausas de 2-3 minutos para que el cerebro consolide la información</li>
        </ul>
        <div class="highlight-box">La atención no se exige. Se diseña.</div>
      `,
      `
        <h2>La Memoria: No es un Almacén, es un Taller</h2>
        <p>La memoria no guarda recuerdos como un ordenador guarda archivos. Cada vez que recuerdas algo, lo reconstruyes y lo modificas ligeramente.</p>
        <p>La memoria de trabajo (donde manipulamos información nueva) tiene una capacidad muy limitada: 4 a 7 elementos a la vez. Sobrecargarla es la causa principal del fracaso en el aprendizaje.</p>
        <div class="highlight-box">Explicar mucho en poco tiempo no es enseñar bien. Es saturar el taller de memoria. El aprendizaje real necesita espacio para manipular, conectar y consolidar.</div>
      `,
      `
        <h2>Momento de Diagnóstico</h2>
        <p>Piensa en la última capacitación o clase a la que asististe. ¿Cómo fue diseñada?</p>
        <div class="interactive-box">
          <p style="margin-bottom: 1rem;">¿Qué técnica predominó?</p>
          <div class="options" id="q7Options">
            <button class="option-btn" onclick="selectOption(this, 'q7')">Exposición magistral (solo hablar)</button>
            <button class="option-btn" onclick="selectOption(this, 'q7')">Alguna dinámica breve</button>
            <button class="option-btn" onclick="selectOption(this, 'q7')">Ejercicios prácticos frecuentes</button>
            <button class="option-btn" onclick="selectOption(this, 'q7')">Trabajo colaborativo real</button>
          </div>
        </div>
      `,
      `
        <h2>El Error como Motor del Aprendizaje</h2>
        <p>El cerebro aprende más de un error que de un acierto. Cuando te equivocas, se libera acetilcolina, que promueve la neuroplasticidad y prepara al cerebro para reconfigurarse.</p>
        <p>Sin embargo, para que esto ocurra, el error debe ser percibido como una oportunidad, no como una amenaza. Si el estudiante teme la humillación, su amígdala bloquea el aprendizaje.</p>
        <div class="highlight-box">Un aula donde el error se castiga es un aula donde el cerebro se apaga. Un aula donde el error se celebra es un aula donde el cerebro se enciende.</div>
      `,
      `
        <h2>Cuatro Principios para Enseñar con el Cerebro en Mente</h2>
        <ul>
          <li><strong>Seguridad Primero:</strong> Sin seguridad emocional, el cerebro no aprende. El miedo y el estrés crónico elevan el cortisol y dañan el hipocampo.</li>
          <li><strong>Emoción como Pegamento:</strong> Los contenidos que emocionan se recuerdan. La curiosidad, la sorpresa y el humor activan el sistema límbico y facilitan la consolidación de la memoria.</li>
          <li><strong>Fragmentar y Conectar:</strong> El cerebro aprende mejor cuando la información se presenta en trozos pequeños y se conecta con lo que ya sabe. El aprendizaje significativo de Ausubel es, en realidad, un principio neurocientífico.</li>
          <li><strong>Repetición Espaciada:</strong> La curva del olvido de Ebbinghaus muestra que olvidamos el 50% de lo aprendido en una hora. Repasar en intervalos crecientes es la estrategia más efectiva.</li>
        </ul>
      `,
      `
        <h2>El Aula del Futuro (que ya debería ser presente)</h2>
        <p>La neuroeducación no pide más presupuesto. Pide comprender cómo funciona el cerebro.</p>
        <p>Pide docentes que sepan que la atención es un músculo, que el error es fertilizante y que la emoción es el pegamento de la memoria.</p>
        <p>Pide un sistema educativo diseñado no para la comodidad del adulto que enseña, sino para el cerebro del niño que aprende.</p>
        <div class="highlight-box">Enseñar sin neuroeducación es volar sin instrumentos. Puedes llegar, pero la probabilidad de estrellarte es mucho mayor.</div>
        <p style="text-align: center; margin-top: 2rem; color: #cdaa7b;">Prof. Mtr. Alvaro Lyon · Lyon Asesor, f.p.</p>
      `
    ];
    function renderSlide() {
      document.getElementById('slideContent').innerHTML = slides[currentSlide];
      document.getElementById('slideNumber').textContent = `${currentSlide + 1} / ${slides.length}`;
      document.getElementById('progress').textContent = `Diapositiva ${currentSlide + 1} de ${slides.length} · Neuroeducación · 1 hora`;
      document.getElementById('prevBtn').disabled = (currentSlide === 0);
      document.getElementById('nextBtn').textContent = (currentSlide === slides.length - 1) ? 'Finalizar' : 'Siguiente →';
    }
    function nextSlide() { if (currentSlide < slides.length - 1) { currentSlide++; renderSlide(); } }
    function prevSlide() { if (currentSlide > 0) { currentSlide--; renderSlide(); } }
    function selectOption(btn, questionId) {
      const options = document.querySelectorAll(`#${questionId}Options .option-btn`);
      options.forEach(opt => opt.classList.remove('selected'));
      btn.classList.add('selected');
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextSlide(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    });
    renderSlide();
  </script>
</body>
</html>

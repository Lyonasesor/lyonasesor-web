<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Conferencia Lyon Asesor</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <!-- Librerías para PDF y QR -->
    <!--
        CAMBIO ARQUITECTÓNICO CLAVE:
        Se elimina html2pdf.bundle (wrapper de alto nivel que decide por su cuenta
        cómo encajar el contenido en una página A4, causando el desencuadre) y se
        usan html2canvas + jsPDF por separado, de forma directa, para tener control
        total sobre: (1) qué elemento exacto se captura, (2) a qué resolución,
        y (3) qué tamaño de página recibe el PDF (que coincidirá EXACTAMENTE con
        las proporciones del diploma, en vez de forzar A4).
    -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-navy: #1a2330;
            --brand-orange: #e86b18;
            --brand-orange-dark: #d45f14;
            --brand-gold: #cdaa7b;
            --brand-bg: #f5f0eb;
            --text-muted: #5a6c7d;
            --border-soft: #e2e8f0;

            /* Lienzo del diploma: tamaño FIJO en píxeles, proporción A4 horizontal
               (297mm x 210mm ≈ 1.414). Este tamaño nunca cambia con el viewport;
               solo se ESCALA visualmente en pantalla con transform: scale(). */
            --diploma-w: 1200px;
            --diploma-h: 848px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--brand-bg);
            color: var(--brand-navy);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 780px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            padding: 40px 44px;
            position: relative;
        }
        @media (max-width: 600px) { .container { padding: 24px 20px; } }

        /* Cuando el diploma está visible, el contenedor pasa a ocupar prácticamente
           toda la altura de la ventana y se convierte en columna flexible, de modo
           que la sección del diploma pueda calcular cuánto espacio real tiene
           disponible y encajar sin scroll. */
        .container.diploma-mode {
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 40px);
            max-width: 1000px;
        }
        .container.diploma-mode .brand,
        .container.diploma-mode > h1,
        .container.diploma-mode > .subtitle,
        .container.diploma-mode > .footer-note {
            display: none;
        }

        .brand { text-align: center; margin-bottom: 8px; }
        .brand img { max-height: 64px; width: auto; }
        .brand .tagline {
            font-family: 'Playfair Display', serif;
            font-size: 0.85rem;
            color: var(--brand-gold);
            letter-spacing: 0.2rem;
            text-transform: uppercase;
            margin-top: 4px;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            color: var(--brand-navy);
            margin: 12px 0 4px;
        }
        h1 span { color: var(--brand-orange); }
        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 24px;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--brand-navy);
            margin-bottom: 4px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border-soft);
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            background: #faf8f5;
            transition: 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--brand-orange);
            outline: none;
            box-shadow: 0 0 0 3px rgba(232,107,24,0.1);
        }
        .form-group select:disabled { opacity: 0.6; cursor: not-allowed; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: var(--brand-orange);
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
            font-family: 'Inter', sans-serif;
        }
        .btn-primary:hover { background: var(--brand-orange-dark); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(232,107,24,0.3); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .error-msg {
            background: #fee2e2; color: #991b1b;
            padding: 12px 16px; border-radius: 12px;
            font-size: 0.9rem; margin-bottom: 16px; display: none;
        }
        .success-msg {
            background: #dcfce7; color: #166534;
            padding: 12px 16px; border-radius: 12px;
            font-size: 0.9rem; margin-bottom: 16px; display: none;
        }

        /* =========================================================
           SECCIÓN DEL DIPLOMA
           Estructura: [stage con el diploma escalado] -> [botones]
           Todo dentro de una columna flex que ocupa el alto disponible,
           así nunca se necesita scroll.
        ========================================================= */
        #diplomaSection {
            display: none; /* se activa con JS: 'flex' */
            flex-direction: column;
            flex: 1;
            min-height: 0;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 8px 0;
        }

        #diplomaStage {
            width: 100%;
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* El lienzo real del diploma: tamaño fijo, nunca cambia.
           Su apariencia en pantalla se controla SOLO con transform:scale(),
           aplicado dinámicamente por JS según el espacio disponible. */
        .diploma-preview {
            width: var(--diploma-w);
            height: var(--diploma-h);
            flex-shrink: 0;
            background: #ffffff;
            border: 10px solid var(--brand-orange);
            border-radius: 28px;
            box-sizing: border-box;
            padding: 55px 85px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
            font-family: 'Georgia', serif;
            transform-origin: center center;
            position: relative;
        }
        .diploma-preview .diploma-inner-border {
            position: absolute;
            inset: 14px;
            border: 1.5px solid rgba(205,170,123,0.45);
            border-radius: 18px;
            pointer-events: none;
        }

        .diploma-preview .cabecera { }
        .diploma-preview .logo-diploma { max-height: 76px; width: auto; margin-bottom: 10px; }
        .diploma-preview .title-empresa {
            font-size: 32px; font-weight: 700; letter-spacing: 5px;
            color: var(--brand-navy); margin-bottom: 3px;
        }
        .diploma-preview .sub-empresa {
            font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
            color: var(--brand-orange); margin-bottom: 14px;
        }
        .diploma-preview .line-divider {
            width: 90px; height: 2px; background: var(--brand-orange); margin: 0 auto;
        }

        .diploma-preview .cuerpo {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .diploma-preview .certifica-text { font-size: 19px; color: var(--text-muted); }
        .diploma-preview .nombre-participante {
            font-size: 42px; font-weight: 700; color: var(--brand-navy); margin: 2px 0;
        }
        .diploma-preview .logro-text {
            font-size: 17px; color: var(--brand-navy); line-height: 1.6; max-width: 820px;
        }
        .diploma-preview .titulo-conferencia {
            font-size: 28px; font-weight: 700; color: var(--brand-orange);
            font-style: italic; margin: 4px 0; max-width: 900px;
        }
        .diploma-preview .horas-text { font-size: 15px; color: var(--text-muted); }

        .diploma-preview .footer-diploma {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 18px;
            border-top: 1px solid #eee;
            gap: 20px;
        }
        .diploma-preview .footer-col { flex: 1; min-width: 0; }
        .diploma-preview .footer-col.left { text-align: left; font-size: 13px; color: var(--text-muted); line-height: 1.6; }
        .diploma-preview .footer-col.left strong { color: var(--brand-navy); }
        .diploma-preview .footer-col.center { text-align: center; }
        .diploma-preview .sello-firma-inline {
            display: flex; justify-content: center; align-items: center; gap: 18px;
        }
        .diploma-preview .sello-firma-inline img { max-height: 62px; width: auto; }
        .diploma-preview .firma-text { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .diploma-preview .footer-col.right { text-align: center; }
        .diploma-preview .footer-col.right .qr-box {
            width: 96px; height: 96px; margin: 0 auto;
        }
        .diploma-preview .qr-label {
            font-size: 10px; color: #94a3b8; letter-spacing: 0.05rem; margin-top: 4px;
        }

        .download-actions {
            display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; flex-shrink: 0;
        }
        .btn-download {
            padding: 12px 28px; border-radius: 40px; border: none;
            font-weight: 600; font-size: 0.95rem; cursor: pointer;
            transition: 0.2s; font-family: 'Inter', sans-serif;
        }
        .btn-download-pdf { background: var(--brand-navy); color: white; }
        .btn-download-pdf:hover { background: #0f172a; transform: translateY(-2px); }
        .btn-download-ebooks { background: var(--brand-gold); color: var(--brand-navy); }
        .btn-download-ebooks:hover { background: #b89565; transform: translateY(-2px); }
        .btn-download:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .download-note { text-align: center; font-size: 0.78rem; color: #94a3b8; flex-shrink: 0; }

        /* Overlay de carga: ahora cubre TODA la pantalla y con z-index alto.
           Esto cumple doble función: (1) feedback visual normal, y (2) sirve de
           "cortina" que oculta al usuario el clon de exportación en resolución
           completa que se renderiza detrás mientras se genera el PDF. */
        .loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(245,240,235,0.97);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #f1f0ed; border-top-color: var(--brand-orange);
            border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .footer-note {
            text-align: center; font-size: 0.75rem; color: #94a3b8;
            margin-top: 20px; border-top: 1px solid #f1f0ed; padding-top: 16px;
        }

        /* Nodo de exportación: vive fuera del flujo visual normal (position:fixed,
           top:0/left:0) para no afectar el scroll ni el layout de la página, pero
           mantiene opacity:1 y visibility:visible para que html2canvas capture
           píxeles reales. Queda oculto detrás del overlay de carga (z-index menor). */
        #diplomaExportRoot {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="container" id="app">

    <div class="brand">
        <img src="assets/img/LYON%20ASESOR.png" alt="Lyon Asesor" style="max-height:60px;">
        <div class="tagline">Formación Profesional</div>
    </div>

    <h1>Registro <span>Conferencia</span></h1>
    <p class="subtitle">Completa tus datos para obtener tu diploma y materiales</p>

    <div id="errorMsg" class="error-msg"></div>
    <div id="successMsg" class="success-msg"></div>

    <!-- FORMULARIO -->
    <form id="registroForm" novalidate>
        <div class="form-group">
            <label for="nombre">Nombre completo *</label>
            <input type="text" id="nombre" placeholder="Ej: María González" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="email">Correo electrónico *</label>
                <input type="email" id="email" placeholder="maria@email.com" required>
            </div>
            <div class="form-group">
                <label for="whatsapp">WhatsApp *</label>
                <input type="tel" id="whatsapp" placeholder="+58 414 123 4567" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="cedula">Cédula / ID *</label>
                <input type="text" id="cedula" placeholder="V-12345678" required>
            </div>
            <div class="form-group">
                <label for="pais">País *</label>
                <select id="pais" required>
                    <option value="">Selecciona</option>
                    <option value="Venezuela">Venezuela</option>
                    <option value="Colombia">Colombia</option>
                    <option value="España">España</option>
                    <option value="México">México</option>
                    <option value="Argentina">Argentina</option>
                    <option value="Chile">Chile</option>
                    <option value="Perú">Perú</option>
                    <option value="Ecuador">Ecuador</option>
                    <option value="EEUU">Estados Unidos</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="ciudad">Ciudad *</label>
            <input type="text" id="ciudad" placeholder="Ej: Caracas" required>
        </div>

        <div class="form-group">
            <label for="conferenciaSelect">Conferencia *</label>
            <select id="conferenciaSelect" required>
                <option value="">Cargando conferencias disponibles...</option>
            </select>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">🎓 Obtener mi diploma y ebooks</button>
    </form>

    <!-- DIPLOMA -->
    <div id="diplomaSection">
        <div id="diplomaStage">
            <div id="diplomaPreviewLive" class="diploma-preview"></div>
        </div>
        <div class="download-actions">
            <button class="btn-download btn-download-pdf" id="downloadPdfBtn">📄 Descargar Diploma (PDF)</button>
            <button class="btn-download btn-download-ebooks" id="downloadEbooksBtn">📚 Descargar 4 Ebooks</button>
        </div>
        <p class="download-note">🔒 Descarga única · Verifica la autenticidad escaneando el código QR del diploma.</p>
    </div>

    <div class="footer-note">
        © 2025 Lyon Asesor · Prof. Mtr. Álvaro Lyon · Datos protegidos y confidenciales
    </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <p id="loadingText" style="color:#5a6c7d;">Generando tu diploma... un momento</p>
</div>

<script>
// =============================================
// CONFIGURACIÓN
// =============================================
const EB00KS = [
    { nombre: 'Este día es tuyo', url: 'https://drive.google.com/uc?export=download&id=1wexcxv48A9wfVUliSyrXiyQRFoXo9hzu' },
    { nombre: 'Diario terapéutico', url: 'https://drive.google.com/uc?export=download&id=1KYfFN_2lh9_tuP6mO0M7fju99Ry8Y5ev' },
    { nombre: 'Ejercicios de bienestar', url: 'https://drive.google.com/uc?export=download&id=1Y4oLyRkHLFIZOkkM4AEa_pnCjNcZXRMq' },
    { nombre: 'Guía de autocuidado', url: 'https://drive.google.com/uc?export=download&id=1O1s3SRq1G_GPZBUJu91fHHYU2UFm-w9-' }
];

// Tamaño fijo del lienzo del diploma (debe coincidir con --diploma-w/--diploma-h del CSS)
const DIPLOMA_W = 1200;
const DIPLOMA_H = 848;

// =============================================
// ESTADO
// =============================================
let registroData = null;
let codigoUnico = null;
let diplomaDescargado = false;
let ebooksDescargados = false;

// =============================================
// CARGAR CONFERENCIAS ACTIVAS
// =============================================
async function cargarConferenciasActivas() {
    try {
        const snapshot = await database.ref('configuracion/conferencias').once('value');
        const data = snapshot.val();
        if (!data) return [];
        const activas = [];
        for (const [id, conf] of Object.entries(data)) {
            if (conf.activa === true) activas.push({ id, titulo: conf.titulo });
        }
        return activas;
    } catch (error) {
        console.error('Error cargando conferencias activas:', error);
        return [];
    }
}

// =============================================
// INICIALIZAR FORMULARIO
// =============================================
document.addEventListener('DOMContentLoaded', async function() {
    const select = document.getElementById('conferenciaSelect');
    const conferencias = await cargarConferenciasActivas();

    if (conferencias.length === 0) {
        select.innerHTML = `<option value="">⚠️ No hay conferencias activas en este momento</option>`;
        select.disabled = true;
        document.getElementById('submitBtn').disabled = true;
        mostrarError('⚠️ No hay conferencias disponibles en este momento. Contacta al organizador.');
        return;
    }

    select.innerHTML = `<option value="">Selecciona la conferencia del día</option>`;
    conferencias.forEach(c => {
        select.innerHTML += `<option value="${c.id}">${c.titulo}</option>`;
    });
    select.disabled = false;
    document.getElementById('submitBtn').disabled = false;

    document.getElementById('registroForm').addEventListener('submit', handleSubmit);
    window.addEventListener('resize', fitDiploma);
});

// =============================================
// MANEJAR SUBMIT
// =============================================
async function handleSubmit(e) {
    e.preventDefault();

    document.getElementById('errorMsg').style.display = 'none';
    document.getElementById('successMsg').style.display = 'none';

    const nombre = document.getElementById('nombre').value.trim();
    const email = document.getElementById('email').value.trim();
    const whatsapp = document.getElementById('whatsapp').value.trim();
    const cedula = document.getElementById('cedula').value.trim();
    const pais = document.getElementById('pais').value;
    const ciudad = document.getElementById('ciudad').value.trim();
    const conferenciaId = document.getElementById('conferenciaSelect').value;
    const conferenciaTitulo = document.getElementById('conferenciaSelect').selectedOptions[0]?.text || '';

    if (!nombre || !email || !whatsapp || !cedula || !pais || !ciudad || !conferenciaId) {
        mostrarError('Por favor, completa todos los campos requeridos.');
        return;
    }
    if (!email.includes('@') || !email.includes('.')) {
        mostrarError('Ingresa un correo electrónico válido.');
        return;
    }

    mostrarOverlay('Generando tu diploma... un momento');
    document.getElementById('submitBtn').disabled = true;

    try {
        const existe = await verificarRegistroExistente(cedula, conferenciaId);
        if (existe) {
            mostrarError('⚠️ Ya has descargado el diploma para esta conferencia. Si necesitas ayuda, contacta a soporte.');
            ocultarOverlay();
            document.getElementById('submitBtn').disabled = false;
            return;
        }

        codigoUnico = generarCodigo(conferenciaId);

        const datos = {
            nombre, email, whatsapp, cedula, pais, ciudad,
            conferencia: conferenciaId,
            tituloConferencia: conferenciaTitulo,
            codigoUnico: codigoUnico,
            timestamp: Date.now(),
            fecha: new Date().toISOString(),
            fechaLegible: new Date().toLocaleString('es-ES'),
            descargado: false,
            ebooksDescargados: false,
            fechaDescarga: null,
            tipo: 'conferencia'
        };

        await database.ref(`leads/conferencias/${cedula}_${conferenciaId}`).set(datos);
        registroData = datos;

        await database.ref(`diplomas_publicos/${codigoUnico}`).set({
            nombre: datos.nombre,
            cedula: datos.cedula,
            tituloConferencia: datos.tituloConferencia,
            pais: datos.pais,
            ciudad: datos.ciudad,
            fecha: datos.fecha,
            fechaLegible: datos.fechaLegible,
            codigoUnico: datos.codigoUnico,
            descargado: false
        });

        await mostrarDiploma(nombre, cedula, conferenciaTitulo, codigoUnico);

        ocultarOverlay();
        document.getElementById('app').classList.add('diploma-mode');
        document.getElementById('registroForm').style.display = 'none';
        document.getElementById('diplomaSection').style.display = 'flex';

        // Esperar a que el layout se asiente antes de calcular la escala.
        requestAnimationFrame(() => requestAnimationFrame(fitDiploma));

        mostrarExito('✅ ¡Registro completado! Tu diploma está listo para descargar.');

    } catch (error) {
        console.error('❌ Error:', error);
        mostrarError('Hubo un error al procesar tu registro. Intenta de nuevo.');
        ocultarOverlay();
        document.getElementById('submitBtn').disabled = false;
    }
}

// =============================================
// VERIFICAR REGISTRO EXISTENTE
// =============================================
async function verificarRegistroExistente(cedula, conferenciaId) {
    try {
        const clave = `${cedula}_${conferenciaId}`;
        const snapshot = await database.ref(`verificaciones/conferencias/${clave}`).once('value');
        return snapshot.val() === true;
    } catch (error) {
        console.error('Error verificando registro:', error);
        return false;
    }
}

// =============================================
// GENERAR CÓDIGO ÚNICO
// =============================================
function generarCodigo(conferenciaId) {
    const prefix = conferenciaId.substring(0, 3).toUpperCase();
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let codigo = prefix + '-';
    for (let i = 0; i < 7; i++) {
        codigo += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return codigo;
}

// =============================================
// MARCADO HTML DEL DIPLOMA (función pura y reutilizable)
// Se usa TANTO para la vista previa en pantalla COMO para el clon de
// exportación en alta resolución, garantizando que sean visualmente
// idénticos: mismo HTML, mismas clases CSS, mismo tamaño de lienzo.
// El único parámetro que cambia entre ambos usos es el id del contenedor
// del QR, para poder generar dos códigos QR independientes con la misma
// librería sin colisión de ids en el DOM.
// =============================================
function construirMarkupDiploma(nombre, titulo, codigo, qrContainerId) {
    return `
        <div class="diploma-inner-border"></div>
        <div class="cabecera">
            <img src="assets/img/LYON%20ASESOR.png" alt="Lyon Asesor" class="logo-diploma" crossorigin="anonymous">
            <div class="title-empresa">LYON ASESOR</div>
            <div class="sub-empresa">Formación Profesional</div>
            <div class="line-divider"></div>
        </div>

        <div class="cuerpo">
            <div class="certifica-text">Certifica que</div>
            <div class="nombre-participante">${escapeHtml(nombre)}</div>
            <div class="logro-text">
                Logró culminar y aprobar satisfactoriamente su participación en la formación
            </div>
            <div class="titulo-conferencia">"${escapeHtml(titulo)}"</div>
            <div class="horas-text">con una duración de 8 horas de formación continua.</div>
        </div>

        <div class="footer-diploma">
            <div class="footer-col left">
                <strong>Código:</strong> ${codigo}<br>
                <strong>Fecha:</strong> ${new Date().toLocaleDateString('es-ES')}
            </div>
            <div class="footer-col center">
                <div class="sello-firma-inline">
                    <img src="assets/img/Sello.png" alt="Sello Lyon Asesor" crossorigin="anonymous">
                    <img src="assets/img/Firma.png" alt="Firma Álvaro Lyon" crossorigin="anonymous">
                </div>
                <div class="firma-text">Prof. Mtr. Álvaro Lyon · Director</div>
            </div>
            <div class="footer-col right">
                <div id="${qrContainerId}" class="qr-box"></div>
                <div class="qr-label">Verifica aquí</div>
            </div>
        </div>
    `;
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function urlValidacion(codigo) {
    return `https://${window.location.hostname}/validar-diploma.html?codigo=${codigo}`;
}

// =============================================
// MOSTRAR DIPLOMA EN PANTALLA (vista previa escalable)
// =============================================
async function mostrarDiploma(nombre, cedula, titulo, codigo) {
    const live = document.getElementById('diplomaPreviewLive');
    live.innerHTML = construirMarkupDiploma(nombre, titulo, codigo, 'qrcodeLive');

    new QRCode(document.getElementById('qrcodeLive'), {
        text: urlValidacion(codigo),
        width: 96,
        height: 96,
        colorDark: '#1a2330',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
    });

    document.getElementById('downloadPdfBtn').onclick = function() {
        if (diplomaDescargado) {
            alert('⚠️ Ya has descargado tu diploma. Solo se permite una descarga por registro.');
            return;
        }
        descargarPDF(nombre, codigo, titulo);
    };

    document.getElementById('downloadEbooksBtn').onclick = function() {
        if (ebooksDescargados) {
            alert('⚠️ Ya has descargado los ebooks. Solo se permite una descarga por registro.');
            return;
        }
        descargarEbooks();
    };
}

// =============================================
// AJUSTE DE ESCALA EN PANTALLA (sin scroll)
// Calcula cuánto espacio vertical/horizontal real hay disponible dentro
// del contenedor y aplica un transform:scale() al lienzo fijo del diploma
// para que TODO (diploma + botones + nota) quepa en una sola pantalla.
// El lienzo en sí (1200x848) nunca cambia de tamaño real: solo se ve más
// grande o más pequeño. Esto es lo que garantiza que lo que se ve en
// pantalla y lo que se descarga sean el mismo diseño, solo a distinta
// resolución de salida.
// =============================================
function fitDiploma() {
    const section = document.getElementById('diplomaSection');
    if (!section || getComputedStyle(section).display === 'none') return;

    const stage = document.getElementById('diplomaStage');
    const live = document.getElementById('diplomaPreviewLive');

    // Reset temporal para medir tamaños "naturales" sin la escala previa.
    live.style.transform = 'scale(1)';
    stage.style.height = '';

    const stageRect = stage.getBoundingClientRect();
    const availableWidth = stageRect.width - 8;
    const availableHeight = stageRect.height - 8;

    const scale = Math.max(
        0.2,
        Math.min(availableWidth / DIPLOMA_W, availableHeight / DIPLOMA_H, 1)
    );

    live.style.transform = `scale(${scale})`;
}

// =============================================
// DESCARGAR PDF — arquitectura de clon en alta resolución
// =============================================
// Por qué un clon y no el elemento visible directamente:
// El elemento visible en pantalla (#diplomaPreviewLive) puede estar
// escalado con transform (para caber sin scroll) y su tamaño de captura
// dependería del zoom del navegador, densidad de píxeles, etc. En vez de
// depender de "cómo se ve ahora mismo", se crea un segundo lienzo
// IDÉNTICO en HTML/CSS (misma función construirMarkupDiploma), a tamaño
// real 1200x848 sin transform alguno, oculto detrás del overlay de carga
// (que cubre toda la pantalla). Se captura ESE, siempre igual, sin
// importar el dispositivo o el estado de scroll de la página.
//
// Por qué el PDF ya no se corta: en vez de forzar el contenido dentro de
// una página A4 fija (que tiene una proporción distinta a la del
// diploma), la página del PDF se crea con el tamaño EXACTO en pulgadas
// que corresponde al lienzo de 1200x848px a 96dpi. El diploma llena la
// página completa, sin sobrante y sin recorte, siempre.
// =============================================
async function descargarPDF(nombre, codigo, titulo) {
    const btn = document.getElementById('downloadPdfBtn');
    const textoOriginal = btn.textContent;
    btn.disabled = true;
    btn.textContent = '⏳ Generando PDF...';

    mostrarOverlay('Generando tu diploma en alta resolución...');

    let exportRoot = null;

    try {
        const clave = `${registroData.cedula}_${registroData.conferencia}`;

        // 1) Construir el clon de exportación a tamaño real, sin transform.
        exportRoot = document.createElement('div');
        exportRoot.id = 'diplomaExportRoot';

        const exportCanvasEl = document.createElement('div');
        exportCanvasEl.className = 'diploma-preview';
        exportCanvasEl.style.transform = 'none';
        exportCanvasEl.innerHTML = construirMarkupDiploma(nombre, titulo, codigo, 'qrcodeExport');

        exportRoot.appendChild(exportCanvasEl);
        document.body.appendChild(exportRoot);

        new QRCode(document.getElementById('qrcodeExport'), {
            text: urlValidacion(codigo),
            width: 96,
            height: 96,
            colorDark: '#1a2330',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H
        });

        // 2) Esperar fuentes web (Playfair Display, Inter) + imágenes (logo, sello, firma).
        if (document.fonts && document.fonts.ready) {
            try { await document.fonts.ready; } catch (e) {}
        }
        const imagenes = exportCanvasEl.querySelectorAll('img');
        await Promise.all(Array.from(imagenes).map(img => {
            if (img.complete && img.naturalWidth > 0) return Promise.resolve();
            return new Promise(resolve => {
                img.onload = resolve;
                img.onerror = resolve;
                setTimeout(resolve, 5000);
            });
        }));

        // 3) Dar un par de frames para que el QR (SVG/canvas) termine de pintarse.
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

        // 4) Registrar la descarga en Firebase (descarga única).
        await database.ref(`leads/conferencias/${clave}`).update({
            descargado: true,
            fechaDescarga: new Date().toISOString()
        });
        await database.ref(`verificaciones/conferencias/${clave}`).set(true);
        await database.ref(`diplomas_publicos/${codigo}`).update({ descargado: true });
        diplomaDescargado = true;

        // 5) Capturar el clon a resolución completa.
        const RESOLUTION_SCALE = 3; // ~ equivalente a impresión de alta calidad
        const canvas = await html2canvas(exportCanvasEl, {
            scale: RESOLUTION_SCALE,
            useCORS: true,
            backgroundColor: '#ffffff',
            logging: false,
            width: DIPLOMA_W,
            height: DIPLOMA_H
        });

        // 6) Construir el PDF con página del mismo tamaño/proporción del lienzo.
        const DPI = 96;
        const pdfWidthIn = DIPLOMA_W / DPI;
        const pdfHeightIn = DIPLOMA_H / DPI;

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
            orientation: 'landscape',
            unit: 'in',
            format: [pdfWidthIn, pdfHeightIn],
            compress: true
        });

        const imgData = canvas.toDataURL('image/jpeg', 0.98);
        pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidthIn, pdfHeightIn, undefined, 'FAST');
        pdf.save(`Diploma_${nombre.replace(/\s/g, '_')}_${codigo}.pdf`);

        btn.textContent = '✅ Diploma descargado';
        console.log('✅ Diploma descargado exitosamente');

    } catch (error) {
        console.error('❌ Error al descargar PDF:', error);
        alert('Hubo un error al generar el PDF: ' + error.message + '\n\nIntenta de nuevo en unos segundos.');
        btn.disabled = false;
        btn.textContent = textoOriginal;
    } finally {
        if (exportRoot) exportRoot.remove();
        ocultarOverlay();
    }
}

// =============================================
// DESCARGAR EBOOKS
// =============================================
function descargarEbooks() {
    const clave = `${registroData.cedula}_${registroData.conferencia}`;

    database.ref(`leads/conferencias/${clave}`).update({
        ebooksDescargados: true
    });

    ebooksDescargados = true;

    EB00KS.forEach((ebook, index) => {
        setTimeout(() => {
            const link = document.createElement('a');
            link.href = ebook.url;
            link.download = `${ebook.nombre}.pdf`;
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }, index * 800);
    });

    document.getElementById('downloadEbooksBtn').disabled = true;
    document.getElementById('downloadEbooksBtn').textContent = '📚 Ebooks descargados';
    alert('📚 Los 4 ebooks comenzarán a descargarse. Revisa tu carpeta de descargas.');
}

// =============================================
// UTILIDADES
// =============================================
function mostrarError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, 6000);
}

function mostrarExito(msg) {
    const el = document.getElementById('successMsg');
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, 6000);
}

function mostrarOverlay(mensaje) {
    document.getElementById('loadingText').textContent = mensaje;
    document.getElementById('loadingOverlay').style.display = 'flex';
}

function ocultarOverlay() {
    document.getElementById('loadingOverlay').style.display = 'none';
}

console.log('✅ Registro de conferencias cargado (arquitectura de exportación v2)');
</script>

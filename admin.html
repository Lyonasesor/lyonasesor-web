<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración · Lyon Asesor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #F0F2F5;
            padding: 2rem;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        h1 { color: #e86b18; margin-bottom: 1rem; }
        .login-box {
            max-width: 400px;
            margin: 3rem auto;
            text-align: center;
        }
        .login-box input {
            width: 100%;
            padding: 0.8rem;
            margin: 0.5rem 0;
            border-radius: 12px;
            border: 1px solid #ddd;
        }
        button {
            background: #e86b18;
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 40px;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .logout-btn {
            background: #1A2330;
            float: right;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1.5rem;
        }
        th, td {
            padding: 0.8rem;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #1A2330;
            color: white;
        }
        .pagado-true {
            background: #E8F5E9;
            color: #2E7D32;
            font-weight: bold;
        }
        .pagado-false {
            background: #FFEBEE;
            color: #C62828;
        }
        .btn-pagar {
            background: #e86b18;
            color: white;
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            cursor: pointer;
        }
        .export-btn {
            background: #1A2330;
            margin-bottom: 1rem;
        }
        .stats {
            background: #F8F0EB;
            padding: 1rem;
            border-radius: 16px;
            margin-bottom: 1rem;
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }
        .stat-item {
            flex: 1;
            text-align: center;
        }
        @media (max-width: 800px) {
            body { padding: 1rem; }
            table { font-size: 0.8rem; }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <div id="loginSection" style="display: none;">
        <div class="login-box">
            <h2>🔐 Acceso restringido</h2>
            <input type="password" id="loginPassword" placeholder="Contraseña del panel">
            <button id="loginBtn">Acceder</button>
            <div id="loginError" style="color: red; margin-top: 0.5rem;"></div>
        </div>
    </div>

    <div id="adminPanel" style="display: none;">
        <div style="overflow: auto;">
            <h1>📊 Panel de Lyon Asesor</h1>
            <button id="logoutBtn" class="logout-btn">Cerrar sesión</button>
            <button id="exportBtn" class="export-btn">📎 Exportar a CSV</button>
            <button id="addTestBtn" style="background:#28a745; float: right; margin-right: 10px;">➕ Agregar prueba</button>
        </div>
        <div class="stats" id="stats"></div>
        <div style="margin: 1rem 0;">
            <label>Filtrar por tipo: </label>
            <select id="tipoFiltro">
                <option value="todos">Todos</option>
                <option value="consulta">Consultas</option>
                <option value="conferencia">Conferencias</option>
                <option value="ebook-lead">Descargas de Ebook</option>
                <option value="diagnostico">Brújula Emocional</option>
            </select>
        </div>
        <div style="overflow-x: auto;">
            <table id="leadsTable">
                <thead>
                    <tr><th>Tipo</th><th>Fecha</th><th>Nombre/Empresa</th><th>Contacto</th><th>Email</th><th>Teléfono</th><th>Detalle</th><th>Monto</th><th>Pagado</th><th>Acción</th></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // =============================================
    // CONFIGURACIÓN DE JSONBIN
    // =============================================
    const BIN_ID = '69ff5dc1adc21f119a775498';
    const API_KEY = '$2a$10$MIMwZ85QZJnw/gAiD5POyuwGxag1w93OLYm9xi9Th.a0p35BUhcYi';

    // Contraseña simple para acceder al panel (cámbiala si quieres)
    const PANEL_PASSWORD = 'lyon2025';

    // =============================================
    // ESTADO Y VARIABLES GLOBALES
    // =============================================
    let registros = [];

    // =============================================
    // INICIO DE SESIÓN (AUTH SIMPLE)
    // =============================================
    function checkLogin() {
        const loggedIn = sessionStorage.getItem('lyonPanelAuth') === 'true';
        if (loggedIn) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadData();
        } else {
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('adminPanel').style.display = 'none';
        }
    }

    document.getElementById('loginBtn').addEventListener('click', function() {
        const pass = document.getElementById('loginPassword').value;
        if (pass === PANEL_PASSWORD) {
            sessionStorage.setItem('lyonPanelAuth', 'true');
            document.getElementById('loginError').innerText = '';
            checkLogin();
        } else {
            document.getElementById('loginError').innerText = '❌ Contraseña incorrecta';
        }
    });

    document.getElementById('logoutBtn').addEventListener('click', function() {
        sessionStorage.removeItem('lyonPanelAuth');
        checkLogin();
    });

    // =============================================
    // CARGAR DATOS DESDE JSONBIN
    // =============================================
    async function loadData() {
        try {
            const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            const data = await response.json();
            registros = data.record.registros || [];
        } catch (error) {
            console.error('Error al cargar datos:', error);
            registros = [];
        }

        // Si no hay registros, mostramos un mensaje en la tabla
        const tbody = document.getElementById('tableBody');
        if (registros.length === 0) {
            tbody.innerHTML = '<tr><td colspan="10">No hay registros</td></tr>';
        }

        renderTable();
        updateStats();
    }

    // =============================================
    // GUARDAR DATOS EN JSONBIN
    // =============================================
    async function saveData() {
        try {
            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY
                },
                body: JSON.stringify({ registros: registros })
            });
        } catch (error) {
            console.error('Error al guardar datos:', error);
        }
    }

    // =============================================
    // RENDERIZAR TABLA
    // =============================================
    function renderTable() {
        const filtro = document.getElementById('tipoFiltro').value;
        let filtered = registros;

        if (filtro !== 'todos') {
            filtered = registros.filter(item => item.tipo === filtro);
        }

        // Ordenar por fecha descendente (más reciente primero)
        filtered.sort((a, b) => {
            const dateA = new Date(a.fecha || a.timestamp || 0);
            const dateB = new Date(b.fecha || b.timestamp || 0);
            return dateB - dateA;
        });

        const tbody = document.getElementById('tableBody');
        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="10">No hay registros</td></tr>';
            return;
        }

        tbody.innerHTML = filtered.map((item, index) => {
            // Formatear datos según tipo
            let nombreEmpresa = item.nombreEmpresa || item.nombre || '';
            let contacto = item.contacto || item.paquete || '';
            let detalle = item.detalle || item.motivo || '';
            let email = item.email || '-';
            let telefono = item.telefono || '-';
            let monto = item.monto || 0;
            let pagado = item.pagado || false;

            if (item.tipo === 'conferencia') {
                nombreEmpresa = item.nombreEmpresa || item.empresa || '';
                contacto = item.contacto || '';
                detalle = item.detalle || `Tema: ${item.tema || ''} | Participantes: ${item.participantes || ''}`;
            } else if (item.tipo === 'ebook-lead') {
                // El nombre ya se guarda en nombreEmpresa, el email y telefono se guardan en sus campos.
                // El detalle se guardó en item.detalle las respuestas del formulario.
                contacto = 'Lead';
                monto = 0;
                pagado = false;
            } else if (item.tipo === 'diagnostico') {
                nombreEmpresa = item.nombreEmpresa;
                email = item.email;
                contacto = 'Autodiagnóstico';
                detalle = item.detalle; // Ejemplo: "Perfil: Brújula Orientada | Puntaje: 20% | Nivel: 1"
                monto = 0;
                pagado = false;
            }

            const fecha = item.fecha || (item.timestamp ? new Date(item.timestamp).toLocaleDateString() : '-');

            return `<tr>
                <td>${item.tipo === 'consulta' ? '📋 Consulta' : 
                        item.tipo === 'conferencia' ? '🎤 Conferencia' : 
                        item.tipo === 'ebook-lead' ? '📘 Ebook' : 
                        item.tipo === 'diagnostico' ? '🧭 Brújula' : item.tipo}</td>
                <td>${fecha}</td>
                <td>${nombreEmpresa}</td>
                <td>${contacto}</td>
                <td>${email}</td>
                <td>${telefono}</td>
                <td>${detalle}</td>
                <td>$${monto}</td>
                <td class="${pagado ? 'pagado-true' : 'pagado-false'}">${pagado ? 'Sí' : 'No'}</td>
                <td>${item.tipo === 'consulta' || item.tipo === 'conferencia' ? 
                    `<button class="btn-pagar" data-index="${index}" data-pagado="${pagado}">${pagado ? 'Desmarcar' : 'Marcar pagado'}</button>` : 
                    `<span style="color:#aaa; font-size:0.8rem;">—</span>`}</td>
            </tr>`;
        }).join('');

        // Agregar eventos a los botones de pagar (solo para consultas y conferencias)
        document.querySelectorAll('.btn-pagar').forEach(btn => {
            btn.addEventListener('click', async function() {
                const index = parseInt(this.getAttribute('data-index'));
                const wasPagado = this.getAttribute('data-pagado') === 'true';
                const nuevoEstado = !wasPagado;

                // Actualizar en el array local
                registros[index].pagado = nuevoEstado;

                // Guardar en JSONBin
                await saveData();

                // Recargar la tabla
                renderTable();
                updateStats();
            });
        });
    }

    // =============================================
    // ACTUALIZAR ESTADÍSTICAS
    // =============================================
    function updateStats() {
        const totalConsultas = registros.filter(r => r.tipo === 'consulta').length;
        const totalConferencias = registros.filter(r => r.tipo === 'conferencia').length;
        const pagadasConsultas = registros.filter(r => r.tipo === 'consulta' && r.pagado).length;
        const pagadasConferencias = registros.filter(r => r.tipo === 'conferencia' && r.pagado).length;
        const totalIngresos = registros.filter(r => r.pagado).reduce((sum, r) => sum + (r.monto || 0), 0);

        document.getElementById('stats').innerHTML = `
            <div class="stat-item"><strong>📋 Consultas</strong><br>Total: ${totalConsultas}<br>Pagadas: ${pagadasConsultas}</div>
            <div class="stat-item"><strong>🎤 Conferencias</strong><br>Total: ${totalConferencias}<br>Pagadas: ${pagadasConferencias}</div>
            <div class="stat-item"><strong>💰 Ingresos totales (pagados)</strong><br>$${totalIngresos}</div>
        `;
    }

    // =============================================
    // AGREGAR REGISTRO DE PRUEBA
    // =============================================
    document.getElementById('addTestBtn').addEventListener('click', async function() {
        const nuevoRegistro = {
            tipo: 'consulta',
            fecha: new Date().toLocaleDateString(),
            nombreEmpresa: 'Cliente de prueba',
            contacto: 'Individual',
            email: 'test@example.com',
            telefono: '+584141234567',
            detalle: 'Motivo de prueba',
            monto: 40,
            pagado: false,
            timestamp: new Date().toISOString()
        };

        registros.push(nuevoRegistro);
        await saveData();
        renderTable();
        updateStats();
    });

    // =============================================
    // EXPORTAR A CSV
    // =============================================
    document.getElementById('exportBtn').addEventListener('click', function() {
        if (registros.length === 0) {
            alert('No hay datos para exportar');
            return;
        }

        let csv = 'Tipo,Fecha,Nombre/Empresa,Contacto,Email,Teléfono,Detalle,Monto,Pagado\n';
        registros.forEach(item => {
            const row = [
                item.tipo === 'consulta' ? 'Consulta' : 
                item.tipo === 'conferencia' ? 'Conferencia' : 
                item.tipo === 'ebook-lead' ? 'Ebook' : 
                item.tipo === 'diagnostico' ? 'Brújula' : item.tipo,
                item.fecha || new Date(item.timestamp).toLocaleDateString(),
                item.nombreEmpresa || item.nombre || '',
                item.contacto || item.paquete || '',
                item.email || '',
                item.telefono || '',
                item.detalle || item.motivo || '',
                item.monto || 0,
                item.pagado ? 'Sí' : 'No'
            ];
            csv += row.join(',') + '\n';
        });

        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'lyon_asesor_leads.csv';
        a.click();
        URL.revokeObjectURL(url);
    });

    // =============================================
    // FILTRO
    // =============================================
    document.getElementById('tipoFiltro').addEventListener('change', function() {
        renderTable();
    });

    // =============================================
    // INICIAR LA APLICACIÓN
    // =============================================
    checkLogin();
</script>
</body>
</html>

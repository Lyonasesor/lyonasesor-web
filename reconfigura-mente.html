<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Google tag (gtag.js) -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reconfigura tu Mente | Lyon Asesor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0f0f0f;
      color: #ffffff;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .slide-container {
      max-width: 800px;
      width: 100%;
      background-color: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 3rem 2rem;
      min-height: 450px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }
    .slide-number {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      color: #cdaa7b;
      font-size: 0.8rem;
      letter-spacing: 0.1rem;
    }
    h1 { font-size: 2.2rem; font-weight: 600; color: #ffffff; margin-bottom: 1rem; }
    h2 { font-size: 1.4rem; font-weight: 400; color: #cdaa7b; margin-bottom: 1.5rem; }
    p { font-size: 1.1rem; line-height: 1.8; color: #ffffff; margin-bottom: 1rem; }
    ul { list-style: none; padding: 0; }
    ul li { padding: 0.5rem 0; padding-left: 1.5rem; position: relative; }
    ul li::before { content: "▸"; position: absolute; left: 0; color: #cdaa7b; }
    .highlight-box {
      background-color: #222;
      border-left: 3px solid #cdaa7b;
      padding: 1.2rem 1.5rem;
      margin: 1.5rem 0;
      border-radius: 0 8px 8px 0;
      font-style: italic;
    }
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin: 1.5rem 0;
    }
    .col-box {
      background-color: #222;
      padding: 1.2rem;
      border-radius: 8px;
    }
    .col-box h3 { color: #cdaa7b; margin-bottom: 0.5rem; font-size: 1rem; }
    .col-box p { font-size: 0.9rem; color: #e8e8e8; }
    .step-box {
      display: grid;
      gap: 0.8rem;
      margin: 1.5rem 0;
    }
    .step-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      background-color: #222;
      padding: 0.8rem 1.2rem;
      border-radius: 8px;
    }
    .step-num {
      background: #cdaa7b;
      color: #0f0f0f;
      font-weight: 700;
      font-size: 1.2rem;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .step-text { font-size: 0.9rem; }
    .nav { display: flex; justify-content: space-between; margin-top: 2rem; gap: 1rem; }
    .btn {
      background: transparent;
      border: 1px solid #cdaa7b;
      color: #cdaa7b;
      padding: 0.7rem 1.5rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn:hover { background: #cdaa7b; color: #0f0f0f; }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .progress { text-align: center; color: #999999; font-size: 0.8rem; margin-top: 1rem; }
    .interactive-box {
      background-color: #222;
      padding: 1.5rem;
      border-radius: 8px;
      margin: 1rem 0;
      text-align: center;
    }
    .options { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-top: 1rem; }
    .option-btn {
      background: transparent;
      border: 1px solid #666;
      color: #ffffff;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .option-btn:hover { border-color: #cdaa7b; color: #cdaa7b; }
    .option-btn.selected { background: #cdaa7b; color: #0f0f0f; border-color: #cdaa7b; }
  </style>
</head>
<body>
  <div class="slide-container" id="slideContainer">
    <span class="slide-number" id="slideNumber">1 / 10</span>
    <div id="slideContent"></div>
  </div>
  <div class="nav">
    <button class="btn" id="prevBtn" onclick="prevSlide()">← Anterior</button>
    <button class="btn" id="nextBtn" onclick="nextSlide()">Siguiente →</button>
  </div>
  <div class="progress" id="progress">Diapositiva 1 de 10 · Reconfigura tu Mente · 90 minutos</div>
  <script>
    let currentSlide = 0;
    const slides = [
      `
        <h1>Reconfigura tu Mente</h1>
        <h2>Neuroplasticidad para el Cambio Personal</h2>
        <p>Prof. Mtr. Alvaro Lyon · Lyon Asesor, f.p.</p>
        <p style="color: #cccccc; margin-top: 2rem;">Conferencia corporativa · 90 minutos de duración</p>
        <p style="color: #999999;">Incluye: Marco teorico - Ejercicios practicos - Espacio de preguntas - Diploma + Ebook</p>
      `,
      `
        <h2>El Mito del Cerebro Inmutable</h2>
        <p>Durante siglos creímos que el cerebro adulto era una estructura fija e inmutable. Que las neuronas solo morían y no se regeneraban.</p>
        <p>Hoy sabemos que eso es falso.</p>
        <p>El neurocientífico Santiago Ramón y Cajal, padre de la neurociencia moderna, ya lo intuyó: "Todo hombre puede ser, si se lo propone, escultor de su propio cerebro."</p>
        <p>Eric Kandel, Nobel de Medicina en 2000, demostró que incluso los circuitos más primitivos pueden modificarse con el aprendizaje.</p>
      `,
      `
        <h2>¿Qué es la Neuroplasticidad?</h2>
        <p>Es la capacidad del sistema nervioso de modificar su estructura y función a lo largo de toda la vida, en respuesta a la experiencia, el aprendizaje o una lesión.</p>
        <p>Michael Merzenich, pionero en el estudio de la plasticidad cerebral, afirma que "el cerebro se reorganiza a sí mismo, momento a momento".</p>
        <p>Existen dos tipos: la plasticidad estructural (nuevas conexiones, poda sináptica) y la plasticidad funcional (una región sana asume la función de una dañada).</p>
      `,
      `
        <h2>Neuronas que se Activan Juntas, se Conectan</h2>
        <p>El principio fundamental de la neuroplasticidad fue enunciado por Donald Hebb en 1949: "Neurons that fire together, wire together".</p>
        <p>Cada vez que practicas una habilidad, un pensamiento o una emoción, fortaleces el circuito neuronal asociado. Cada vez que dejas de hacerlo, esa conexión se debilita y se "poda" para ahorrar energía.</p>
        <p>El famoso estudio de los taxistas de Londres (Maguire et al., 2000) demostró que el hipocampo — la región de la memoria espacial — crecía físicamente cuantos más años de experiencia tenían.</p>
      `,
      `
        <h2>La Plasticidad Autodirigida</h2>
        <p>Jeffrey Schwartz demostró algo revolucionario con pacientes de Trastorno Obsesivo-Compulsivo: la atención consciente y sostenida puede cambiar físicamente los circuitos cerebrales.</p>
        <p>No necesitas años de terapia. No necesitas un evento traumático. Necesitas enfocar tu atención deliberadamente en lo que quieres fortalecer.</p>
        <div class="highlight-box">La atención es el cincel que esculpe tu cerebro.</div>
      `,
      `
        <h2>El Experimento del Piano</h2>
        <p>Alvaro Pascual-Leone realizó un experimento crucial en neuroplasticidad.</p>
        <p>Dividió a voluntarios en dos grupos: uno practicaba piano físicamente y otro solo visualizaba practicar. Al medir sus cerebros, la misma región motora se había expandido en ambos grupos.</p>
        <p>Visualizar una acción fortalece las mismas conexiones que ejecutarla físicamente.</p>
        <div class="highlight-box">Tu cerebro no distingue entre una experiencia real y una vívidamente imaginada.</div>
      `,
      `
        <h2>Momento de Reflexión</h2>
        <p>Piensa en una creencia limitante que llevas años cargando. "No soy bueno con la gente", "Soy desordenado por naturaleza", "Ya estoy muy mayor para cambiar".</p>
        <p>Esa creencia no es una verdad. Es un circuito que se fortaleció con la repetición.</p>
        <div class="interactive-box">
          <p style="margin-bottom: 1rem;">¿Estás listo/a para reconfigurar ese circuito?</p>
          <div class="options" id="q6Options">
            <button class="option-btn" onclick="selectOption(this, 'q6')">Sí, quiero empezar hoy</button>
            <button class="option-btn" onclick="selectOption(this, 'q6')">Tengo dudas, pero quiero intentarlo</button>
            <button class="option-btn" onclick="selectOption(this, 'q6')">Necesito más información primero</button>
          </div>
        </div>
      `,
      `
        <h2>El Ciclo del Cambio Cerebral</h2>
        <div class="step-box">
          <div class="step-item"><span class="step-num">1</span><span class="step-text"><strong>Atención Plena (Darse Cuenta):</strong> Identificar la creencia o hábito limitante que opera en automático.</span></div>
          <div class="step-item"><span class="step-num">2</span><span class="step-text"><strong>Intención (Elegir):</strong> Decidir conscientemente qué nuevo circuito quieres construir.</span></div>
          <div class="step-item"><span class="step-num">3</span><span class="step-text"><strong>Acción (Hacer):</strong> Actuar, aunque sea con miedo. La acción es el combustible de la plasticidad.</span></div>
          <div class="step-item"><span class="step-num">4</span><span class="step-text"><strong>Repetición (Consolidar):</strong> Repetir hasta que el nuevo circuito se vuelva automático.</span></div>
        </div>
      `,
      `
        <h2>Tres Herramientas para Reconfigurarte</h2>
        <ul>
          <li><strong>Visualización Encarnada:</strong> No solo imagines el resultado. Imagina el proceso. Siente en tu cuerpo cómo sería actuar desde tu nueva identidad.</li>
          <li><strong>Micro-Acciones (Método Kaizen):</strong> No intentes cambiar todo hoy. Cada día, realiza una pequeña acción que desafíe la vieja creencia.</li>
          <li><strong>Celebración del Error:</strong> Cada vez que te equivocas intentando algo nuevo, tu cerebro libera acetilcolina, que promueve la plasticidad. El error es literalmente el fertilizante del cerebro.</li>
        </ul>
      `,
      `
        <h2>El Escultor de tu Propio Cerebro</h2>
        <p>No estás condenado a ser como siempre has sido.</p>
        <p>Tu personalidad, tus hábitos, tus reacciones emocionales... todo eso son circuitos que se construyeron en algún momento. Y todo circuito que se construyó puede reconfigurarse.</p>
        <p>La neuroplasticidad es la prueba científica de que el cambio es posible. No es magia. Es biología.</p>
        <div class="highlight-box">"Todo hombre puede ser, si se lo propone, escultor de su propio cerebro." — Santiago Ramón y Cajal</div>
        <p style="text-align: center; margin-top: 2rem; color: #cdaa7b;">Prof. Mtr. Alvaro Lyon · Lyon Asesor, f.p.</p>
      `
    ];
    function renderSlide() {
      document.getElementById('slideContent').innerHTML = slides[currentSlide];
      document.getElementById('slideNumber').textContent = `${currentSlide + 1} / ${slides.length}`;
      document.getElementById('progress').textContent = `Diapositiva ${currentSlide + 1} de ${slides.length} · Reconfigura tu Mente · 90 minutos`;
      document.getElementById('prevBtn').disabled = (currentSlide === 0);
      document.getElementById('nextBtn').textContent = (currentSlide === slides.length - 1) ? 'Finalizar' : 'Siguiente →';
    }
    function nextSlide() { if (currentSlide < slides.length - 1) { currentSlide++; renderSlide(); } }
    function prevSlide() { if (currentSlide > 0) { currentSlide--; renderSlide(); } }
    function selectOption(btn, questionId) {
      const options = document.querySelectorAll(`#${questionId}Options .option-btn`);
      options.forEach(opt => opt.classList.remove('selected'));
      btn.classList.add('selected');
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextSlide(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    });
    renderSlide();
  </script>
</body>
</html>

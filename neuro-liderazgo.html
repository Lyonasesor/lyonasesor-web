<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Google tag (gtag.js) -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuroLiderazgo | Lyon Asesor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0f0f0f;
      color: #ffffff;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .slide-container {
      max-width: 800px;
      width: 100%;
      background-color: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 3rem 2rem;
      min-height: 450px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }
    .slide-number {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      color: #cdaa7b;
      font-size: 0.8rem;
      letter-spacing: 0.1rem;
    }
    h1 { font-size: 2.2rem; font-weight: 600; color: #ffffff; margin-bottom: 1rem; }
    h2 { font-size: 1.4rem; font-weight: 400; color: #cdaa7b; margin-bottom: 1.5rem; }
    p { font-size: 1.1rem; line-height: 1.8; color: #ffffff; margin-bottom: 1rem; }
    ul { list-style: none; padding: 0; }
    ul li { padding: 0.5rem 0; padding-left: 1.5rem; position: relative; }
    ul li::before { content: "▸"; position: absolute; left: 0; color: #cdaa7b; }
    .highlight-box {
      background-color: #222;
      border-left: 3px solid #cdaa7b;
      padding: 1.2rem 1.5rem;
      margin: 1.5rem 0;
      border-radius: 0 8px 8px 0;
      font-style: italic;
    }
    .neuro-box {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      margin: 1.5rem 0;
    }
    .neuro-card {
      background-color: #222;
      padding: 1.2rem;
      border-radius: 8px;
      text-align: center;
    }
    .neuro-card .emoji { font-size: 2rem; margin-bottom: 0.5rem; }
    .neuro-card .name { font-weight: 600; color: #cdaa7b; margin-bottom: 0.3rem; }
    .neuro-card .desc { font-size: 0.85rem; color: #e8e8e8; }
    .nav { display: flex; justify-content: space-between; margin-top: 2rem; gap: 1rem; }
    .btn {
      background: transparent;
      border: 1px solid #cdaa7b;
      color: #cdaa7b;
      padding: 0.7rem 1.5rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn:hover { background: #cdaa7b; color: #0f0f0f; }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .progress { text-align: center; color: #999999; font-size: 0.8rem; margin-top: 1rem; }
    .interactive-question {
      background-color: #222;
      padding: 1.5rem;
      border-radius: 8px;
      margin: 1rem 0;
      text-align: center;
    }
    .options { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-top: 1rem; }
    .option-btn {
      background: transparent;
      border: 1px solid #666;
      color: #ffffff;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .option-btn:hover { border-color: #cdaa7b; color: #cdaa7b; }
    .option-btn.selected { background: #cdaa7b; color: #0f0f0f; border-color: #cdaa7b; }
  </style>
</head>
<body>
  <div class="slide-container" id="slideContainer">
    <span class="slide-number" id="slideNumber">1 / 10</span>
    <div id="slideContent"></div>
  </div>
  <div class="nav">
    <button class="btn" id="prevBtn" onclick="prevSlide()">← Anterior</button>
    <button class="btn" id="nextBtn" onclick="nextSlide()">Siguiente →</button>
  </div>
  <div class="progress" id="progress">Diapositiva 1 de 10 · NeuroLiderazgo · 90 minutos</div>
  <script>
    let currentSlide = 0;
    const slides = [
      `
        <h1>NeuroLiderazgo</h1>
        <h2>El Cerebro que Inspira Equipos</h2>
        <p>Prof. Mtr. Alvaro Lyon · Lyon Asesor, f.p.</p>
        <p style="color: #cccccc; margin-top: 2rem;">Conferencia corporativa · 90 minutos de duración</p>
        <p style="color: #999999;">Incluye: Marco teorico - Ejercicios practicos - Espacio de preguntas - Diploma + Ebook</p>
      `,
      `
        <h2>La Pregunta que Incomoda</h2>
        <p>¿Cuántos de ustedes han tenido un jefe que técnicamente era brillante, pero que drenaba la energía de todo el equipo?</p>
        <p>Ahora, levanten la mano si alguna vez trabajaron para alguien que no era el que más sabía, pero que los hacía sentir capaces, escuchados y motivados.</p>
        <div class="highlight-box">El neuroliderazgo no pregunta "¿cuánto sabes?". Pregunta "¿cómo impacta tu presencia en el cerebro de quienes te siguen?"</div>
      `,
      `
        <h2>La Química del Liderazgo</h2>
        <p>Cuatro neurotransmisores gobiernan la respuesta de tu equipo hacia ti como líder:</p>
        <div class="neuro-box">
          <div class="neuro-card">
            <div class="emoji">🤝</div>
            <div class="name">Oxitocina</div>
            <div class="desc">Confianza y vínculo. Se libera con reconocimiento y conexión genuina.</div>
          </div>
          <div class="neuro-card">
            <div class="emoji">🎯</div>
            <div class="name">Dopamina</div>
            <div class="desc">Motivación y recompensa. Se activa al alcanzar metas y recibir retroalimentación positiva.</div>
          </div>
          <div class="neuro-card">
            <div class="emoji">😌</div>
            <div class="name">Serotonina</div>
            <div class="desc">Bienestar y estabilidad. Se eleva con el reconocimiento social y el sentido de pertenencia.</div>
          </div>
          <div class="neuro-card">
            <div class="emoji">💪</div>
            <div class="name">Endorfinas</div>
            <div class="desc">Resiliencia ante el estrés. Se liberan al superar desafíos y celebrar logros.</div>
          </div>
        </div>
      `,
      `
        <h2>El Cerebro Bajo Amenaza</h2>
        <p>Cuando un líder grita, humilla o ignora, activa en el cerebro de su equipo la <strong>amígdala</strong>, el centro del miedo.</p>
        <p>Un cerebro en modo supervivencia no puede:</p>
        <ul>
          <li>Ser creativo</li>
          <li>Resolver problemas complejos</li>
          <li>Colaborar genuinamente</li>
        </ul>
        <div class="highlight-box">"Un gerente que no agrega valor es el que utiliza la crítica indiscriminada y la desvalorización permanente." — Néstor Braidot</div>
      `,
      `
        <h2>Momento de Reflexión</h2>
        <p>Piensa en la última situación de presión con tu equipo. ¿Cuál fue tu primera reacción?</p>
        <div class="interactive-question">
          <p style="margin-bottom: 1rem;">Selecciona la opción que más se parezca a ti:</p>
          <div class="options" id="q1Options">
            <button class="option-btn" onclick="selectOption(this, 'q1')">Escuché antes de decidir</button>
            <button class="option-btn" onclick="selectOption(this, 'q1')">Di instrucciones inmediatas</button>
            <button class="option-btn" onclick="selectOption(this, 'q1')">Me alejé para pensar solo</button>
            <button class="option-btn" onclick="selectOption(this, 'q1')">Consulté con el equipo</button>
          </div>
        </div>
      `,
      `
        <h2>La Ventana de Tolerancia</h2>
        <p>Cada persona tiene un umbral de estrés que puede manejar antes de que su cerebro "explote" (secuestro amigdalar).</p>
        <p>Un líder que conoce su propia ventana de tolerancia y la de su equipo puede:</p>
        <ul>
          <li>Anticipar conflictos antes de que escalen</li>
          <li>Crear pausas estratégicas en momentos de tensión</li>
          <li>Modelar la regulación emocional para todo el equipo</li>
        </ul>
        <div class="highlight-box">El líder no controla las emociones del equipo. Modela cómo navegarlas.</div>
      `,
      `
        <h2>El Líder Atencional</h2>
        <p>Néstor Braidot acuñó el concepto de <strong>densidad de atención</strong>: la cantidad de atención que un líder es capaz de focalizar.</p>
        <p>Un líder con alta densidad atencional:</p>
        <ul>
          <li>Percibe señales débiles que otros ignoran</li>
          <li>Toma decisiones más conscientes y menos reactivas</li>
          <li>Está presente de verdad cuando su equipo lo necesita</li>
        </ul>
        <div class="highlight-box">"Una adecuada densidad de atención modela el cerebro, en un sentido literal." — Néstor Braidot</div>
      `,
      `
        <h2>El Cerebro se Transforma</h2>
        <p>La neuroplasticidad es la capacidad del cerebro de reorganizarse y crear nuevas conexiones a lo largo de toda la vida.</p>
        <p>Esto significa que:</p>
        <ul>
          <li>Ningún estilo de liderazgo está grabado en piedra</li>
          <li>Puedes entrenar tu cerebro para responder en lugar de reaccionar</li>
          <li>Cada nueva conducta de liderazgo que practicas crea un camino neuronal que se fortalece con la repetición</li>
        </ul>
        <p style="margin-top: 1rem;">El neuroliderazgo no es un talento innato. Es una capacidad que se entrena, se mide y se mejora.</p>
      `,
      `
        <h2>Tres Herramientas para Empezar Hoy</h2>
        <ul>
          <li><strong>La pausa de 3 segundos:</strong> Antes de responder en una reunión tensa, respira profundo 3 segundos. Ese tiempo permite que tu corteza prefrontal recupere el control sobre tu amígdala.</li>
          <li><strong>Reconocimiento específico:</strong> Una vez al día, dile a alguien de tu equipo exactamente qué hizo bien y por qué fue valioso. Activa la oxitocina y la dopamina.</li>
          <li><strong>Check-in emocional:</strong> Inicia cada reunión preguntando: "¿Cómo llegan hoy?". No es terapia. Es neuroliderazgo aplicado.</li>
        </ul>
      `,
      `
        <h2>El Liderazgo que Inspira</h2>
        <p>No se trata de ser el que más sabe.</p>
        <p>Se trata de ser el que mejor entiende cómo funciona el cerebro humano.</p>
        <p>Y de usar ese conocimiento para que cada persona que trabaja contigo sienta que su cerebro está seguro, valorado y motivado para dar lo mejor de sí.</p>
        <div class="highlight-box">"El desafío de un líder consiste en propiciar la formación de determinados caminos neurales, volverlos dominantes y potenciarlos en pos de la excelencia." — Néstor Braidot</div>
        <p style="text-align: center; margin-top: 2rem; color: #cdaa7b;">Prof. Mtr. Alvaro Lyon · Lyon Asesor, f.p.</p>
      `
    ];
    function renderSlide() {
      document.getElementById('slideContent').innerHTML = slides[currentSlide];
      document.getElementById('slideNumber').textContent = `${currentSlide + 1} / ${slides.length}`;
      document.getElementById('progress').textContent = `Diapositiva ${currentSlide + 1} de ${slides.length} · NeuroLiderazgo · 90 minutos`;
      document.getElementById('prevBtn').disabled = (currentSlide === 0);
      document.getElementById('nextBtn').textContent = (currentSlide === slides.length - 1) ? 'Finalizar' : 'Siguiente →';
    }
    function nextSlide() { if (currentSlide < slides.length - 1) { currentSlide++; renderSlide(); } }
    function prevSlide() { if (currentSlide > 0) { currentSlide--; renderSlide(); } }
    function selectOption(btn, questionId) {
      const options = document.querySelectorAll(`#${questionId}Options .option-btn`);
      options.forEach(opt => opt.classList.remove('selected'));
      btn.classList.add('selected');
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextSlide(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    });
    renderSlide();
  </script>
</body>
</html>

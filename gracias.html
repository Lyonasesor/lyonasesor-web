<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Gracias por tu compra! · Lyon Asesor</title>
    <meta name="description" content="¡Gracias por tu compra en Lyon Asesor!">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --naranja: #e86b18;
            --naranja-luz: #f28c4e;
            --naranja-oscuro: #c95a10;
            --navy: #1A2330;
            --navy-light: #243042;
            --navy-dark: #0f1720;
            --crema: #faf8f5;
            --blanco-calido: #fefdfb;
            --text-dark: #2C3E50;
            --text-muted: #5A6C7D;
            --text-light: #8899A6;
            --shadow-md: 0 4px 20px rgba(26,35,48,0.12);
            --shadow-lg: 0 8px 40px rgba(26,35,48,0.16);
            --shadow-orange: 0 4px 20px rgba(232,107,24,0.3);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --transition-fast: 0.2s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            background: var(--blanco-calido);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .page-wrapper {
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            background: #fff;
            border-radius: var(--radius);
            padding: 3rem 2.5rem;
            box-shadow: var(--shadow-lg);
            text-align: center;
            border: 1px solid rgba(26,35,48,0.06);
        }
        .page-wrapper .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        .page-wrapper h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(2rem, 4vw, 2.6rem);
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 0.5rem;
        }
        .page-wrapper h1 span { color: var(--naranja); }
        .page-wrapper .sub {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .producto-box {
            background: var(--crema);
            padding: 1.5rem;
            border-radius: var(--radius-sm);
            margin-bottom: 2rem;
            border-left: 4px solid var(--naranja);
            text-align: left;
        }
        .producto-box h3 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.1rem;
            color: var(--navy);
            margin-bottom: 0.3rem;
        }
        .producto-box p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin: 0;
        }

        /* Botón de descarga para biblioteca */
        .btn-download {
            display: inline-block;
            background: linear-gradient(135deg, var(--naranja), var(--naranja-luz));
            color: #fff;
            padding: 16px 36px;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: var(--shadow-orange);
            transition: var(--transition);
            font-size: 1rem;
            margin-top: 1rem;
        }
        .btn-download:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(232,107,24,0.5);
        }

        /* Botón de WhatsApp para consultas y conferencias */
        .btn-whatsapp-success {
            display: inline-block;
            background: #25D366;
            color: #fff;
            padding: 16px 36px;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(37,211,102,0.3);
            transition: var(--transition);
            font-size: 1rem;
            margin-top: 1rem;
        }
        .btn-whatsapp-success:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(37,211,102,0.5);
        }

        .back-link {
            display: inline-block;
            margin-top: 2rem;
            color: var(--naranja);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition-fast);
        }
        .back-link:hover {
            color: var(--naranja-oscuro);
            text-decoration: underline;
        }

        @media (max-width: 640px) {
            .page-wrapper { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="page-wrapper" id="app">
        <div class="icon">🎉</div>
        <h1>¡Gracias por tu <span>compra</span>!</h1>
        <div class="sub">Tu pago ha sido procesado exitosamente</div>

        <!-- PRODUCTO -->
        <div class="producto-box" id="productoInfo">
            <h3 id="productoNombre">📚 Biblioteca Lyon Asesor</h3>
            <p id="productoDetalle">4 herramientas digitales para tu bienestar emocional.</p>
        </div>

        <!-- CONTENIDO DINÁMICO SEGÚN PRODUCTO -->
        <div id="contenidoDinamico">
            <!-- Será llenado por JavaScript -->
        </div>

        <a href="index.html" class="back-link">← Volver al inicio</a>
    </div>

    <script>
        // =============================================
        // DETECTAR PRODUCTO DESDE LA URL
        // =============================================
        const urlParams = new URLSearchParams(window.location.search);
        const producto = urlParams.get('producto') || 'biblioteca';

        const productoInfo = {
            biblioteca: {
                nombre: '📚 Biblioteca Lyon Asesor',
                detalle: '4 herramientas digitales para tu bienestar emocional: ebook + 3 guías prácticas.',
                mensaje: 'Aquí tienes tus archivos listos para descargar:'
            },
            consulta: {
                nombre: '🧘 Proceso Terapéutico',
                detalle: 'Acompañamiento profesional personalizado. Sesiones de 45-60 minutos.',
                mensaje: 'Coordina tu primera sesión directamente con Alvaro por WhatsApp:'
            },
            conferencia: {
                nombre: '🎤 Conferencia Lyon Asesor',
                detalle: '12 temáticas transformadoras para empresas e instituciones. Diploma + ebook incluidos.',
                mensaje: 'Coordina los detalles de tu conferencia directamente con Alvaro por WhatsApp:'
            }
        };

        const info = productoInfo[producto] || productoInfo['biblioteca'];

        // Mostrar información del producto
        document.getElementById('productoNombre').textContent = info.nombre;
        document.getElementById('productoDetalle').textContent = info.detalle;

        // =============================================
        // GENERAR CONTENIDO DINÁMICO SEGÚN PRODUCTO
        // =============================================
        const contenedor = document.getElementById('contenidoDinamico');

        if (producto === 'biblioteca') {
            // Mostrar enlace de descarga directa
            contenedor.innerHTML = `
                <p style="font-size:1rem; color:var(--text-muted); margin:1rem 0;">
                    ${info.mensaje}
                </p>
                <a href="https://lyonasesor-web.pages.dev/descargasahora" target="_blank" class="btn-download">
                    📥 Descargar mis ebooks ahora
                </a>
                <p style="font-size:0.85rem; color:var(--text-muted); margin-top:0.8rem;">
                    Los archivos también están disponibles en la página de descarga.
                </p>
            `;
        } else if (producto === 'consulta') {
            // Mostrar botón de WhatsApp para consultas
            const mensajeWhatsApp = encodeURIComponent('Hola Alvaro, acabo de pagar mi consulta y quiero coordinar la primera sesión.');
            contenedor.innerHTML = `
                <p style="font-size:1rem; color:var(--text-muted); margin:1rem 0;">
                    ${info.mensaje}
                </p>
                <a href="https://wa.me/584148610464?text=${mensajeWhatsApp}" target="_blank" class="btn-whatsapp-success">
                    📲 Contactar por WhatsApp
                </a>
            `;
        } else if (producto === 'conferencia') {
            // Mostrar botón de WhatsApp para conferencias
            const mensajeWhatsApp = encodeURIComponent('Hola Alvaro, acabo de pagar mi conferencia y quiero coordinar los detalles.');
            contenedor.innerHTML = `
                <p style="font-size:1rem; color:var(--text-muted); margin:1rem 0;">
                    ${info.mensaje}
                </p>
                <a href="https://wa.me/584148610464?text=${mensajeWhatsApp}" target="_blank" class="btn-whatsapp-success">
                    📲 Contactar por WhatsApp
                </a>
            `;
        }
    </script>
</body>
</html>
